# Copy to nexus.yaml for local startup. Keep real secrets out of this file.
data_dir: ./data

log:
  level: info
  format: text
  file: ""
  max_size_mb: 100
  max_backups: 7
  max_age_days: 28
  compress: true

ingress:
  listen_addr: ":8080"
  api_keys: []
  ip_whitelist: []
  require_sdk_envelope: false
  # Longest session grant a user may sign, in blocks past the current height (17280 ≈ 24h at 5s blocks).
  # Must be the same on every Builder.
  max_session_grant_blocks: 17280
  # Blocks the chain state of a session's registered signing key is reused for (1..10, default 5),
  # and the chain reads per second allowed on cache misses (default 20).
  session_key_cache_ttl_blocks: 5
  session_key_lookups_per_second: 20
  # BuilderSyncService requests a second, and their burst, from one source address: the other
  # Builders of this Builder's groups sync their orders here (defaults 200 and 400).
  builder_sync_requests_per_second: 200
  builder_sync_burst: 400
  # ingress terminates TLS itself; no front proxy and no CA-issued certificate is needed.
  # Order: `nexus tls init` generates a self-signed certificate (default <data_dir>/tls/) and prints the public key fingerprint →
  # the operator runs `nexus builder register` with the operator key to write the https address and fingerprint
  # (tls_pubkey_hash = sha256(certificate public key)) into the on-chain descriptor → set enabled=true and start.
  # start only loads the certificate and checks the on-chain fingerprint; it never generates a certificate or changes the descriptor:
  # a missing certificate or a fingerprint not on chain refuses startup. When enabled, identity.public_endpoint must be https.
  # Rotating the certificate = rotating the public key: init again (delete the old files first) → register → restart.
  tls:
    enabled: false
    cert_file: ""   # optional: your own PEM certificate chain; paired with key_file, relative paths are relative to this file
    key_file: ""

# Encrypted task input is stored in local Pebble until chain deadline or task termination.
# This limit also bounds decoded Ingress messages and raw HTTP request bodies.
payload_storage:
  max_bytes: 16777216

# Final plaintext is stored unencrypted in local Pebble until SDK ACK or TTL.
output_delivery:
  require_plaintext_output: false
  output_max_bytes: 1048576
  plaintext_ttl: 4h
  tombstone_ttl: 24h
  sweep_interval: 1m

# V1 plaintext task data is stored as content-addressed files below data_dir.
# Capacity is reserved from the declared object size before Nexus accepts bytes.
task_data:
  inline_max_bytes: 1048576
  chunk_size_bytes: 262144 # at most 983040: an output frame must fit one 1 MiB Builder sync request
  max_range_bytes: 8388608
  max_blob_bytes: 1073741824
  spool_reservation_bytes: 4294967296
  disk_accept_watermark_percent: 85
  # OpenTask requests may expire at most this many Task Chain blocks ahead. Task data requests use
  # the Hub parameter service.max_service_material_expiry_blocks instead.
  request_ttl_blocks: 20
  # Task data requests one user account may make per minute; 0 disables the cap.
  user_requests_per_minute: 600
  # Fallback retention window for Builder storage confirmations
  # when the object carries no authoritative retention height.
  # Must outlast the verify + challenge windows (devnet: ~700 blocks after
  # open verify), otherwise the Builder promises less than the chain requires.
  retention_lease_blocks: 1000
  # Rechecks quarantined objects and authoritative cleanup heights.
  sweep_interval: 1m
  # A deleted object's tombstone refuses re-uploads of its key and answers it as
  # expired. The sweep reclaims it this many blocks after max(deletion height,
  # retention height); 0 keeps tombstones forever. The unit is blocks: 120960 is
  # about 7 days at 5-second blocks (about 1.4 days at 1-second blocks).
  tombstone_retention_blocks: 120960
  # Streaming OUTPUT (UploadTaskOutputStream / frame-based SubscribeOutput).
  # On by default: Cortex only delivers OUTPUT through this stream. Set
  # enabled: false to make the three RPCs answer Unimplemented (no OUTPUT can
  # then be uploaded at all).
  #
  # What decides whether a stream is valid must be identical on every Nexus.
  # The maximum frame count and the minimum frame size come from the chain task
  # params evidence.max_output_mmr_leaves and
  # evidence.min_output_stream_frame_bytes, read once at startup. Setting
  # max_output_mmr_leaves or min_output_stream_frame_bytes here is optional and
  # only cross-checks the chain value: a different value stops startup.
  # max_attachment_bytes below and chunk_size_bytes above, which doubles as the
  # per-frame text limit, are local and must match on every Nexus: differing
  # values mean one Builder accepts a frame another rejects, and the Verifier
  # then cannot fetch a complete object.
  # subscriber_buffer_frames only affects local subscribers and may differ.
  output_stream:
    enabled: true
    max_attachment_bytes: 65536
    subscriber_buffer_frames: 256

# Direct dispatch: standing handraises from Cortex nodes, signed handraise roots and local
# admission. These are off-chain parameters; the handraise timing and the accept timeout tiers must
# be the same on every Builder of a network. The values below are placeholders until calibrated.
dispatch:
  # A Cortex node re-signs an unchanged standing handraise this often.
  handraise_heartbeat_ms: 2000
  # A standing handraise not re-signed within this time leaves the roster; must exceed the heartbeat.
  handraise_ttl_ms: 6000
  # Minimum spacing of re-signs caused by a state change (free slots, profiles).
  handraise_min_change_interval_ms: 200
  # This Builder signs a new handraise root this often.
  handraise_root_interval_ms: 500
  # How far above this Builder's chain height a handraise's issued_height may be (this Builder
  # may lag the Cortex by a few blocks).
  handraise_issued_height_tolerance_blocks: 3
  # Accept/reject wait of a dispatched ticket by the candidate's measured RTT; tiers increase in
  # both values, an RTT above the last tier takes the last tier.
  accept_timeout_ms_by_rtt_tier:
    - max_rtt_ms: 50
      accept_timeout_ms: 300
    - max_rtt_ms: 150
      accept_timeout_ms: 500
    - max_rtt_ms: 300
      accept_timeout_ms: 800
  # Public RTT admission threshold: a handraise measured above it is not admitted and its root leaf
  # records the RTT. 0 admits every RTT.
  builder_rtt_admit_ms: 300
  # A Worker whose signed rejects exceed this share of the tickets it received is not admitted for
  # gpu_reject_rate_suspension_blocks blocks (also the measuring window). 0 disables the rule.
  gpu_reject_rate_threshold: 0.5
  gpu_reject_rate_suspension_blocks: 720
  # Fewest tickets inside the window before a reject rate can suspend a Worker.
  gpu_reject_rate_min_samples: 10
  # Share of TIMEOUT skips flagged by the public statistics; statistics only.
  builder_timeout_rate_threshold: 0.2
  # Gas limit of a dispatch record transaction: record_gas_base plus record_gas_per_entry per entry.
  record_gas_base: 200000
  record_gas_per_entry: 300000
  # Gas limit of a compensation rebuttal or challenge response: answer_gas_base plus
  # answer_gas_per_byte per encoded byte of the message. Doubled (up to 8x) after an out-of-gas.
  answer_gas_base: 300000
  answer_gas_per_byte: 30

# Production security switch: dev (default, behavior unchanged) | production.
# production rejects: non-loopback plaintext chain/hub grpc_addr;
# private_key_hex / private_key / keystore_password / service_keystore_password in identity;
# ingress.tls.enabled=false. Private keys and passphrases always come from files.
security:
  mode: dev

chain:
  # The Task Node requires NODED_TASK_EVENT_GRPC_ENABLED=true.
  # With hub.enabled=false it also requires
  # NODED_TASK_EVENT_GRPC_PROTOCOL_EVENTS_ENABLED=true.
  grpc_addr: 127.0.0.1:9090         # once node has TLS enabled, use https://host:9090 (verified against system root CAs)
  chain_id: trueopen-localnet-1
  gas_limit: 200000
  fee_denom: utrueopen
  fee_amount: "5000"
  # MsgSweepDeadline is the single public deadline runner:
  # any account may submit it and the runner pays its own gas, so acting as that
  # runner is an operational choice, not a protocol duty. Default off — nexus only
  # observes DEADLINE_SWEPT events. When enabled, nexus sweeps only the verify
  # deadlines the chain itself published for tasks this Builder is tracking.
  deadline_sweep:
    enabled: false
    # Blocks to wait after a deadline passes before sweeping it yourself, so the
    # EndBlock executor and other Builders get first crack. 0 = sweep on expiry,
    # which makes every Builder race for the same mostly-NOOP transaction.
    grace_blocks: 10
  # A Verifier commit or result relay answers only after its transaction executed in a
  # block, waiting at most block_interval × wait_blocks (capped at 20s: below the 60s
  # Cortex relay call timeout). No result in time
  # is reported as a temporary failure and the Verifier retries.
  tx_confirm:
    block_interval: 5s
    wait_blocks: 3

# Hub is the sole source of truth for the Builder registry and stake when enabled. The chain block
# above remains the Task Chain used for task execution and events.
hub:
  # When enabled, the Hub Node requires both
  # NODED_TASK_EVENT_GRPC_ENABLED=true and
  # NODED_TASK_EVENT_GRPC_PROTOCOL_EVENTS_ENABLED=true.
  enabled: false
  grpc_addr: ""
  chain_id: ""
  gas_limit: 200000
  fee_denom: utrueopen
  fee_amount: "5000"

identity:
  builder_address: ""
  bech32_prefix: trueopen
  private_key_file: ./builder.key
  private_key: ""
  private_key_hex: ""
  keystore_file: ""
  keystore_password: ""
  keystore_password_file: ""
  # Optional service key used for Node application-level builder signatures.
  # When omitted, Nexus shares the account key and logs a startup warning.
  service_keystore_file: ""
  service_keystore_password: ""
  service_keystore_password_file: ""
  # Builder VRF keys for direct dispatch: Ed25519 in the Cosmos keystore armor
  # (key type ed25519), mode 0600, kept apart from the service key. List the
  # key registered on chain now and any earlier key still needed for orders of
  # an epoch it was active in; the chain's registered key picks the one used.
  # The passphrase file (mode 0600) serves every listed key.
  # Env: NEXUS_VRF_KEY_FILES (comma separated), NEXUS_VRF_KEY_PASSWORD_FILE.
  vrf_key_files: []
  vrf_key_password_file: ""
  # Production endpoint must be absolute HTTPS: turn on ingress.tls so Nexus
  # terminates TLS itself and clients can check tls_pubkey_hash.
  public_endpoint: ""
  # Phase 0 has no BuilderBond: the former builder_bond block and the
  # NEXUS_BUILDER_BOND_DENOM / NEXUS_BUILDER_BOND_AMOUNT variables are gone;
  # a leftover builder_bond key in YAML fails startup (strict schema).
  moniker: ""
  p2p_hint: ""
  # On-chain ServiceDescriptorV1.endpoints. Leave the list
  # empty to derive three endpoints from public_endpoint: NEXUS_GRPC and
  # OBJECT_GATEWAY_HTTPS point at it directly, HEALTH_HTTPS appends /healthz.
  # Set it explicitly when the three services are not all on the Connect port.
  #
  # kind must be NEXUS_GRPC / OBJECT_GATEWAY_HTTPS / HEALTH_HTTPS, each at most
  # once; the submitter sorts by kind. uri scheme is the closed set
  # http/https/grpc/grpcs — despite the kind names, the Keeper does accept http.
  # Credentials, query strings and fragments are rejected. protocol_version
  # defaults to "v1" and only allows [A-Za-z0-9._-]. tls_pubkey_hash is optional;
  # when set it must be 64 lowercase hex characters and not all zero.
  service_endpoints: []
  # service_endpoints:
  #   - kind: NEXUS_GRPC
  #     uri: "https://builder.example:8080"
  #     protocol_version: "v1"
  #   - kind: OBJECT_GATEWAY_HTTPS
  #     uri: "https://builder.example:8080"
  #   - kind: HEALTH_HTTPS
  #     uri: "https://builder.example:8080/healthz"
  # Deprecated and ignored: the on-chain descriptor has no
  # effective/expires height, so there is no validity window to renew. Both keys
  # are still accepted so existing nexus.yaml files keep passing strict parsing.
  descriptor_validity_blocks: 100000
  descriptor_renew_before_blocks: 10000
