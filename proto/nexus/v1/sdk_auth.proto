syntax = "proto3";
package nexus.v1;


option go_package = "github.com/TrueOpen/nexus/gen/trueopen/nexus/v1;nexusv1";

// SessionGrantV1 lets a user's wallet authorize a short-lived client session
// key once, so that read and delivery-progress requests need no wallet prompt.
// It is always signed under the SDK Request EIP-712 domain (see
// SDKRequestEnvelopeV2), including when TaskDataRequestAuthV1 carries it, and
// never under the Task Data Request domain. The typed struct is
//
//   SessionGrant(string chainId,string user,address sessionKey,
//     uint64 expiryHeight,bytes32 grantNonce)
//
// whose fields project fields 1-5 in order: user as canonical Bech32 text,
// session_key as an EIP-712 address, grant_nonce as raw 32 bytes. A request
// that carries a grant binds it through sessionGrantHash = hashStruct(SessionGrant).
// The grant's domain chainId is its own signature_chain_id, chosen by the
// wallet when it signed; hashStruct carries no domain, so a grant and the
// requests under it may use different signature_chain_id values.
//
// A verifier rejects the grant unless:
//   - chain_id equals the verifier's own chain_id (whether the request's
//     chain_id field matches is checked at the signature step), and user
//     equals the request's signer (signer_address or requester_address);
//   - user_signature recovers over the SessionGrant signing digest, rebuilt with
//     signature_chain_id as the domain chainId, to user, user
//     is an existing on-chain account, and the recovered public key equals the
//     account's stored public key;
//   - current_height <= expiry_height <= current_height + max_session_grant_blocks,
//     with checked addition; a verifier that cannot read the chain height rejects.
//     max_session_grant_blocks is off-chain configuration that every Task
//     Builder must set to the same value;
//   - the request is in the session-allowed set: OpenTask, ResumeOutput, GetDispatchRoster, SubscribeOutput,
//     AckOutput, GetTaskEvents and PrepareChallenge on SDKRequestEnvelopeV2,
//     and GetTaskDataMetadata and FetchTaskData of an OUTPUT object on
//     TaskDataRequestAuthV1. Every other request must be signed by the wallet
//     directly and is rejected when it carries a grant;
//   - for OpenTask, user also equals the SignedOrder user_address, otherwise
//     SDK_AUTH_SESSION_GRANT_INVALID. This grant does not authorize orders;
//     order authorization is independent and requires the wallet or a key
//     separately registered on that session's StreamState.
//
// The request signature itself is compared only with session_key; no account
// public key is looked up for it. There is no revocation list: a grant is
// bounded only by its expiry, may be reused until then, and is not a replay
// record of its own. The session key is generated by the client, kept in memory
// only, and never derived from any signature.
message SessionGrantV1 {
  string chain_id = 1;
  // Canonical Bech32 account address of the granting user.
  string user = 2;
  // Raw 20-byte address of the session key. It is not an on-chain account.
  bytes session_key = 3;
  uint64 expiry_height = 4;
  // 32 bytes from a client CSPRNG.
  bytes grant_nonce = 5;
  // 65 bytes R||S||V, V in {27, 28}, low S, over the SessionGrant signing digest.
  bytes user_signature = 6;
  // EIP-712 domain chainId of user_signature, 1..MaxInt64. Not in the typed data.
  uint64 signature_chain_id = 7;
}

// SDKRequestEnvelopeV2 authenticates a user request to Builder Ingress:
// OpenTask, ResumeOutput, GetDispatchRoster, SubscribeOutput, AckOutput, GetTaskEvents and PrepareChallenge. It
// carries no Task input, output or evidence.
//
// The signature is EIP-712 under the SDK Request domain
//
//   EIP712Domain(string name,string version,uint256 chainId)
//   name = "TrueOpen SDK Request", version = "1", chainId = signature_chain_id
//
// over the primary type
//
//   SDKRequest(string chainId,string method,string endpoint,bytes32 sessionId,
//     bytes32 taskId,bytes32 requestNonce,uint64 expiryHeightOrTime,
//     bytes32 bodyDigest,bytes32 sessionGrantHash)
//
// (one line in the real encodeType). Typed fields 1-8 are chain_id, method and
// endpoint as given; session_id and task_id strictly decoded to raw 32 bytes;
// request_nonce, exactly 32 bytes; expiry_height_or_time as uint64; and
// body_digest as raw 32 bytes. Anything that cannot be projected is rejected
// before a digest is built. sessionGrantHash is derived by the
// verifier: 32 zero bytes without session_grant, hashStruct(SessionGrant) with
// it. request_domain, signer_address, signature and signer_pubkey do not enter
// the typed data.
//
//   signing_digest = keccak256(0x19 || 0x01 || domain_separator || hash_struct)
//
// The digest is signed once, never hashed again, never as hex text and never
// through personal_sign, eth_sign or any EIP-191 prefix. A client holding the
// key signs the same digest directly; a browser wallet uses
// eth_signTypedData_v4.
//
// The domain chainId is signature_chain_id, chosen by the signer and carried in
// the envelope: a browser wallet uses its active network, so the user never
// switches networks, and a session key or server uses its SDK default. It must
// be in 1..MaxInt64. It isolates nothing: cross-chain isolation comes only from
// the typed chainId string, which the verifier takes from its own chain. The
// same request signed under another signature_chain_id has the same replay
// key; no identity, replay or dedup key may include the signature or
// signature_chain_id.
//
// Without session_grant, recovery to signer_address selects the wallet path,
// where the public key must equal the account's stored public key. Otherwise
// use the registered-key branch below. With
// session_grant the grant is verified as described on SessionGrantV1 and the
// signature must recover to its session_key. OpenTask accepts a grant whose
// user equals the SignedOrder user (see SessionGrantV1).
//
// Registered-key branch (no grant, recovered address differs from owner):
// first require the session named by session_id to exist and not be CLOSED,
// owner to equal signer_address, and recovery to equal its current key; then
// require current_height <= session_key_expiry_height; finally check the
// session method allowlist.
// State/key mismatch is SDK_AUTH_INVALID_SIGNATURE; disallowed method is
// SDK_AUTH_SESSION_METHOD_NOT_ALLOWED; expired key is
// SDK_AUTH_SESSION_GRANT_EXPIRED. sessionGrantHash remains 32 zero bytes.
// Requests do not consume spend_cap. Cache entries, including missing sessions
// and absent keys, carry a read height and expire after a configured block
// limit. Clear on event-stream disconnect, invalidate on session_key_updated,
// and fetch authoritative state on a miss; unavailable state rejects. Apply
// ingress rate limits to bound cache misses.
// OpenTask prechecks delegated order authorization before storing input. A
// nonzero cap failure is SDK_AUTH_SESSION_KEY_SPEND_CAP_EXCEEDED. Keeper remains
// final authority. A later assignment rejection emits RECORD_REJECTED; recovery
// checks committed sequence state before resigning the same unused sequence.
// Refresh the signing key after rotation, use the wallet after CLEAR, or renew
// the grant after expiry/cap failure. Local terminal-task retry recovery is a
// separate service implementation requirement, not a new wire field.
//
// The verifier runs five steps in order and stops at the first failure:
//   1. Format: session_id and task_id as 0x followed by 64 lowercase hex characters, a 32-byte
//      request_nonce, expiry_height_or_time above zero, endpoint matching
//      method, for OpenTask a chain-height expiry (below 10^12; a Unix
//      millisecond value is rejected here) and the derived task_id and
//      payload_ref, signer_address
//      (and the OpenTask body user_address) in canonical lowercase Bech32 with
//      the chain's account prefix, trueopen, decoding to exactly 20 bytes,
//      signature_chain_id (and the grant's) in 1..MaxInt64, and a body that
//      projects -> NEXUS_INGRESS_MALFORMED. A chain_id other than
//      the verifier's could be seen here but is not a format error; see step 4.
//   2. With session_grant, a method outside the session-allowed set ->
//      SDK_AUTH_SESSION_METHOD_NOT_ALLOWED.
//   3. With session_grant, a grant whose chain, user, user signature or stored
//      account key does not match, or for OpenTask whose user is not the
//      SignedOrder user -> SDK_AUTH_SESSION_GRANT_INVALID; a grant
//      outside its height window -> SDK_AUTH_SESSION_GRANT_EXPIRED.
//   4. The request signature, over the digest rebuilt with the sessionGrantHash
//      the verifier derives, recovering to anything but the expected address,
//      or a wallet-signed request whose account key does not match ->
//      SDK_AUTH_INVALID_SIGNATURE. A wrong grant hash shows up only here. The
//      verifier rebuilds the digest with its own chain_id (typed chainId),
//      never with the envelope's chain_id, and the envelope's
//      signature_chain_id (domain chainId), and
//      the envelope chain_id must equal the verifier's own chain_id. A request
//      signed for another chain, or whose chain_id field names another chain,
//      fails here with SDK_AUTH_INVALID_SIGNATURE.
//   5. Request expiry -> SDK_AUTH_EXPIRED; nonce replay -> SDK_AUTH_REPLAY.
//      An OpenTask chain-height expiry must satisfy
//      current_height <= expiry <= current_height + request_ttl_blocks, with
//      checked addition; request_ttl_blocks is Builder configuration, default 20.
// Steps 3 and 5 need the current chain height and reject when it is unavailable.
// An account public key never changes once stored, so a verifier may cache it
// by address, but a cache miss it cannot fill is a rejection.
//
// body_digest is H_FIELDS_V1 under the body domain of the method called:
// TRUEOPEN_SDK_BODY_OPEN_TASK_V1, TRUEOPEN_SDK_BODY_SUBSCRIBE_OUTPUT_V1,
// TRUEOPEN_SDK_BODY_ACK_OUTPUT_V1, TRUEOPEN_SDK_BODY_GET_TASK_EVENTS_V1 or
// TRUEOPEN_SDK_BODY_PREPARE_CHALLENGE_V1 (registry/v1/domains.json lists the
// fields).
//
// Replay key: request_domain \x00 chain_id \x00 signer_address \x00 hex(request_nonce),
// where chain_id is the verifier's own chain_id, not the envelope field.
// A session-key request is still keyed by signer_address, the granting user.
message SDKRequestEnvelopeV2 {
  // Exactly "TRUEOPEN_SDK_REQUEST_V2". Checked and used in the replay key; not signed.
  string request_domain = 1;
  // Must equal the verifier's own chain_id. The verifier never builds the
  // digest or the replay key from it; a mismatch is rejected at the signature
  // step with SDK_AUTH_INVALID_SIGNATURE, not as a format error.
  string chain_id = 2;
  // The bare name of the method called, such as "SubscribeOutput".
  string method = 3;
  // The full procedure, /nexus.v1.IngressAPI/<Method>, whose <Method> must
  // equal method.
  string endpoint = 4;
  // The Hash32 as 0x followed by 64 lowercase hex characters (66 in all). Any
  // other spelling, including a bare 64-character hex string, is rejected before
  // projection.
  string session_id = 5;
  // Same spelling as session_id. For OpenTask it must equal
  // TRUEOPEN_TASK_ID_V1(session_id, order_sequence).
  string task_id = 6;
  // Exactly 32 bytes, unique per signer.
  bytes request_nonce = 7;
  // Above zero; 0 and negative values are rejected before projection into the
  // uint64 typed field. Values of 10^12 and above are Unix milliseconds;
  // smaller values are a chain height, accepted only for OpenTask. OpenTask
  // accepts only a chain height: a Unix millisecond value is
  // NEXUS_INGRESS_MALFORMED at the format step, and the height must satisfy
  // current_height <= expiry <= current_height + request_ttl_blocks (see
  // OpenTaskHeader).
  int64 expiry_height_or_time = 8;
  // 32 bytes: the body domain digest of the method called.
  bytes body_digest = 9;
  // Canonical lowercase Bech32 address of the user with the chain's account
  // prefix, trueopen, decoding to exactly 20 bytes; anything else is
  // NEXUS_INGRESS_MALFORMED at the format step. Not signed: this is the user
  // whose account, off-chain grant or registered session key authorizes recovery.
  string signer_address = 10;
  // 65 bytes R||S||V, V in {27, 28}, low S, over the SDKRequest signing digest.
  bytes signature = 11;
  // Ignored. The verifier never derives or checks an address from it; the
  // signer is recovered from signature.
  bytes signer_pubkey = 12 [deprecated = true];
  // Absent permits the user's wallet or this session's registered key.
  SessionGrantV1 session_grant = 13;
  // EIP-712 domain chainId of signature, 1..MaxInt64. Not in the typed data
  // and not in the replay key.
  uint64 signature_chain_id = 14;
}
