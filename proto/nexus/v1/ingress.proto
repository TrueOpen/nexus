syntax = "proto3";

package nexus.v1;

import "nexus/v1/dispatch.proto";
import "nexus/v1/sdk_auth.proto";
import "shared/v1/evidence.proto";
import "task/v1/commit.proto";
import "task/v1/dispatch.proto";
import "task/v1/evidence.proto";
import "task/v1/infer_receipt.proto";
import "task/v1/result.proto";

option go_package = "github.com/TrueOpen/nexus/gen/trueopen/nexus/v1;nexusv1";

// IngressAPI authenticates user requests, direct dispatch streams and task data.
service IngressAPI {
  // OpenTask executes the OpenTask operation.
  rpc OpenTask(stream OpenTaskRequest) returns (OpenTaskResponse);
  // SubscribeOutput binds delivery to an optional dispatch attempt commitment.
  rpc SubscribeOutput(SubscribeOutputRequest) returns (stream SubscribeOutputResponse);
  // AckOutput executes the AckOutput operation.
  rpc AckOutput(AckOutputRequest) returns (AckOutputResponse);
  // GetTaskStatus executes the GetTaskStatus operation.
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
  // GetTaskEvents executes the GetTaskEvents operation.
  rpc GetTaskEvents(GetTaskEventsRequest) returns (stream GetTaskEventsResponse);
  // PrepareChallenge executes the PrepareChallenge operation.
  rpc PrepareChallenge(PrepareChallengeRequest) returns (PrepareChallengeResponse);

  // UploadTaskResultObject executes the UploadTaskResultObject operation.
  rpc UploadTaskResultObject(stream UploadTaskResultObjectRequest) returns (UploadTaskResultObjectResponse);
  // UploadTaskOutputStream executes the UploadTaskOutputStream operation.
  rpc UploadTaskOutputStream(stream UploadTaskOutputStreamRequest) returns (stream UploadTaskOutputStreamResponse);
  // GetTaskDataMetadata executes the GetTaskDataMetadata operation.
  rpc GetTaskDataMetadata(GetTaskDataMetadataRequest) returns (GetTaskDataMetadataResponse);
  // FetchTaskData executes the FetchTaskData operation.
  rpc FetchTaskData(FetchTaskDataRequest) returns (stream FetchTaskDataResponse);
  // FinalizeTaskResult executes the FinalizeTaskResult operation.
  rpc FinalizeTaskResult(FinalizeTaskResultRequest) returns (FinalizeTaskResultResponse);
  // FinalizeVerifierEvidence executes the FinalizeVerifierEvidence operation.
  rpc FinalizeVerifierEvidence(FinalizeVerifierEvidenceRequest) returns (FinalizeVerifierEvidenceResponse);

  // SubmitInferReceipt executes the SubmitInferReceipt operation.
  rpc SubmitInferReceipt(SubmitInferReceiptRequest) returns (SubmitInferReceiptResponse);
  // SubmitVerifyCommit executes the SubmitVerifyCommit operation.
  rpc SubmitVerifyCommit(SubmitVerifyCommitRequest) returns (SubmitVerifyCommitResponse);
  // SubmitVerifyResult executes the SubmitVerifyResult operation.
  rpc SubmitVerifyResult(SubmitVerifyResultRequest) returns (SubmitVerifyResultResponse);

  // DispatchStream carries authenticated, cursor-scoped Builder/Cortex messages.
  rpc DispatchStream(stream DispatchStreamRequest) returns (stream DispatchStreamResponse);
  // ResumeOutput resumes one authenticated output attempt.
  rpc ResumeOutput(ResumeOutputRequest) returns (stream ResumeOutputResponse);
  // GetDispatchRoster returns every round's roster and its bound signed root.
  rpc GetDispatchRoster(GetDispatchRosterRequest) returns (GetDispatchRosterResponse);
}

// TaskDataObjectKind defines the TaskDataObjectKind wire type.
enum TaskDataObjectKind {
  // TASK_DATA_OBJECT_KIND_UNSPECIFIED identifies the corresponding protocol value.
  TASK_DATA_OBJECT_KIND_UNSPECIFIED = 0;
  // TASK_DATA_OBJECT_KIND_INPUT identifies the corresponding protocol value.
  TASK_DATA_OBJECT_KIND_INPUT = 1;
  // TASK_DATA_OBJECT_KIND_OUTPUT identifies the corresponding protocol value.
  TASK_DATA_OBJECT_KIND_OUTPUT = 2;
  // TASK_DATA_OBJECT_KIND_EVIDENCE_MANIFEST identifies the corresponding protocol value.
  TASK_DATA_OBJECT_KIND_EVIDENCE_MANIFEST = 3;
  // TASK_DATA_OBJECT_KIND_EVIDENCE_ARTIFACT identifies the corresponding protocol value.
  TASK_DATA_OBJECT_KIND_EVIDENCE_ARTIFACT = 4;
}

//
// TaskDataObjectReadinessV1 defines the TaskDataObjectReadinessV1 wire type.
enum TaskDataObjectReadinessV1 {
  // TASK_DATA_OBJECT_READINESS_V1_UNSPECIFIED identifies the corresponding protocol value.
  TASK_DATA_OBJECT_READINESS_V1_UNSPECIFIED = 0;
  // TASK_DATA_OBJECT_READINESS_V1_STORED identifies the corresponding protocol value.
  TASK_DATA_OBJECT_READINESS_V1_STORED = 1;
  // TASK_DATA_OBJECT_READINESS_V1_READY identifies the corresponding protocol value.
  TASK_DATA_OBJECT_READINESS_V1_READY = 2;
}

// TaskDataReadinessV1 defines the TaskDataReadinessV1 wire type.
enum TaskDataReadinessV1 {
  // TASK_DATA_READINESS_V1_UNSPECIFIED identifies the corresponding protocol value.
  TASK_DATA_READINESS_V1_UNSPECIFIED = 0;
  // TASK_DATA_READINESS_V1_INPUT_READY identifies the corresponding protocol value.
  TASK_DATA_READINESS_V1_INPUT_READY = 1;
  // TASK_DATA_READINESS_V1_RESULT_STAGING identifies the corresponding protocol value.
  TASK_DATA_READINESS_V1_RESULT_STAGING = 2;
  // TASK_DATA_READINESS_V1_READY identifies the corresponding protocol value.
  TASK_DATA_READINESS_V1_READY = 3;
  // OUTPUT is frozen, but one or both required Worker bundles are still pending.
  TASK_DATA_READINESS_V1_OUTPUT_FROZEN = 4;
  // At least one required Worker evidence bundle is frozen.
  TASK_DATA_READINESS_V1_EVIDENCE_PARTIAL = 5;
}

// EvidenceProducerKindV1 defines the EvidenceProducerKindV1 wire type.
enum EvidenceProducerKindV1 {
  // EVIDENCE_PRODUCER_KIND_V1_UNSPECIFIED identifies the corresponding protocol value.
  EVIDENCE_PRODUCER_KIND_V1_UNSPECIFIED = 0;
  // EVIDENCE_PRODUCER_KIND_V1_WORKER identifies the corresponding protocol value.
  EVIDENCE_PRODUCER_KIND_V1_WORKER = 1;
  // EVIDENCE_PRODUCER_KIND_V1_VERIFIER identifies the corresponding protocol value.
  EVIDENCE_PRODUCER_KIND_V1_VERIFIER = 2;
}

// TaskDataRequesterKindV1 defines the TaskDataRequesterKindV1 wire type.
enum TaskDataRequesterKindV1 {
  // TASK_DATA_REQUESTER_KIND_V1_UNSPECIFIED identifies the corresponding protocol value.
  TASK_DATA_REQUESTER_KIND_V1_UNSPECIFIED = 0;
  // TASK_DATA_REQUESTER_KIND_V1_USER identifies the corresponding protocol value.
  TASK_DATA_REQUESTER_KIND_V1_USER = 1;
  // TASK_DATA_REQUESTER_KIND_V1_CORTEX_SERVICE identifies the corresponding protocol value.
  TASK_DATA_REQUESTER_KIND_V1_CORTEX_SERVICE = 2;
}

//
// Non-evidence objects use verify_round=0 and no producer_operator.
// TaskDataObjectRefV1 defines the TaskDataObjectRefV1 wire type.
message TaskDataObjectRefV1 {
  string task_hash = 1;
  string session_id = 2;
  string task_id = 3;
  TaskDataObjectKind object_kind = 4;
  string content_hash = 5;
  EvidenceProducerKindV1 evidence_producer_kind = 6;
  uint32 verify_round = 7;
  optional string producer_operator = 8;
  // Required for evidence objects; UNSPECIFIED for INPUT and OUTPUT.
  shared.v1.EvidenceKind evidence_kind = 9;
}

// TaskDataObjectMetadataV1 defines the TaskDataObjectMetadataV1 wire type.
message TaskDataObjectMetadataV1 {
  TaskDataObjectRefV1 object_ref = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
  TaskDataObjectReadinessV1 readiness = 4;
  repeated uint32 chunk_lengths = 5;
  uint64 output_leaf_count = 6;
  // fin is the Worker-signed terminal frame of this object's output stream,
  // byte-identical to the one the Builder received and replays on subscription.
  //
  // It is here so that whether a caller can tell "the model finished" from "the
  // budget cut it off" does not depend on which retrieval path they chose.
  // Before this, finish_reason existed only on the subscription's terminal
  // frame, so a non-streaming fetch returned text with no way to know whether
  // it was complete, and retrieval is meant to be a transport detail rather
  // than something that changes which facts are obtainable.
  //
  // Present only for OUTPUT objects that have reached STORED; absent for INPUT
  // and EVIDENCE, which have no output stream, and absent before the stream is
  // terminated. The signature is the Worker's over TRUEOPEN_OUTPUT_FIN_V1 and
  // is what makes this a fact the caller can check rather than a Builder
  // assertion: verify it against the Worker's current service key and compare
  // output_mmr_root with the receipt before trusting finish_reason.
  optional OutputFinV1 fin = 7;
}

// EvidenceBundleSummaryV1 defines the EvidenceBundleSummaryV1 wire type.
message EvidenceBundleSummaryV1 {
  // Digest of exact manifest bytes; not the on-chain typed commitment.
  string evidence_manifest_hash = 1;
  string evidence_schema_hash = 2;
  uint32 artifact_count = 3;
  uint64 artifact_total_size_bytes = 4;
  uint64 manifest_size_bytes = 5;
}

// ByteRangeV1 defines the ByteRangeV1 wire type.
message ByteRangeV1 {
  uint64 offset = 1;
  uint64 length = 2;
}

//
//   builder_storage_confirmation_digest =
//     H_FIELDS_V1("TRUEOPEN_BUILDER_STORAGE_CONFIRMATION_V2",
//       u32_be(schema_version), utf8(chain_id),
//       address_codec_bytes(builder_operator_address),
//       u64_be(service_authorization_nonce), canonical TaskDataObjectRefV1,
//       u64_be(size_bytes), u64_be(artifact_total_size_bytes),
//       u64_be(retention_until_height))
// Non-evidence objects use producer_kind=UNSPECIFIED, verify_round=0,
// no producer_operator, and artifact_total_size_bytes=0.
// BuilderStorageConfirmationV1 defines the BuilderStorageConfirmationV1 wire type.
message BuilderStorageConfirmationV1 {
  uint32 schema_version = 1;
  string chain_id = 2;
  string builder_operator_address = 3;
  uint64 service_authorization_nonce = 4;
  TaskDataObjectRefV1 object_ref = 5;
  uint64 size_bytes = 6;
  uint64 artifact_total_size_bytes = 7;
  uint64 retention_until_height = 8;
  // Compact low-S raw64 signature.
  bytes service_signature = 9;
}

// TaskDataRequestAuthV1 authenticates one Task data request: upload,
// finalize, metadata and fetch. requester_kind alone selects the verifier, and
// no caller-supplied public key is ever trusted.
//
// CORTEX_SERVICE signs H_FIELDS_V1("TRUEOPEN_TASK_DATA_REQUEST_V1", fields 1-10)
// with its current service key: exactly 64 bytes R||S, low S. It must carry the
// nonzero nonce of its ACTIVE service binding in field 8 and must not carry
// session_grant.
//
// USER signs EIP-712 typed data and supplies exactly 65 bytes R||S||V, V in
// {27, 28}, low S. The domain is
//
//   EIP712Domain(string name,string version,uint256 chainId)
//   name = "TrueOpen Task Data Request", version = "2", chainId = signature_chain_id
//
// and the primary type is
//
//   TaskDataRequest(uint32 schemaVersion,string chainId,
//     string builderOperatorAddress,string rpcMethod,bytes32 bodyDigest,
//     uint32 requesterKind,string requesterAddress,
//     uint64 serviceAuthorizationNonce,bytes32 requestNonce,uint64 expiryHeight,
//     bytes32 sessionGrantHash)
//
// (one line in the real encodeType, with no spaces after the commas). Typed
// fields 1-10 project fields 1-10: the two addresses as canonical Bech32 text,
// body_digest and request_nonce as raw 32 bytes. sessionGrantHash is 32 zero
// bytes without session_grant and hashStruct(SessionGrant) with it. signing
// digest = keccak256(0x19 || 0x01 || domain_separator || hash_struct). The
// chainId string must match the current chain; the domain chainId is the
// request's signature_chain_id, chosen by the signer (see SDKRequestEnvelopeV2).
// Domain version "1" (no sessionGrantHash) is not accepted. A USER request
// carries service_authorization_nonce 0 and a signature_chain_id in
// 1..MaxInt64; a CORTEX_SERVICE request carries signature_chain_id 0, which
// enters neither its preimage nor its replay key.
//
// Without session_grant the recovered address must equal requester_address,
// or the current registered key of the session from this Builder's local Task
// record (missing record rejects). The registered-key branch uses the owner,
// status, expiry, method and cache rules of SDKRequestEnvelopeV2, with
// requester_address in place of signer_address. It allows only OUTPUT
// GetTaskDataMetadata/FetchTaskData. Invalid state/key maps to
// DATA_ACCESS_INVALID_SIGNATURE, expiry to DATA_ACCESS_SESSION_GRANT_EXPIRED,
// and disallowed method/object to DATA_ACCESS_SESSION_METHOD_NOT_ALLOWED.
// With session_grant the grant is verified as described on SessionGrantV1, with
// requester_address in place of signer_address, the signature must recover to
// session_key, rpc_method must be GetTaskDataMetadata or FetchTaskData, and the
// object reference must have object_kind OUTPUT.
//
// A USER request is checked in the five steps of SDKRequestEnvelopeV2 and
// stops at the first failure:
//   1. Format, including signature_chain_id (and the grant's) in 1..MaxInt64
//      -> NEXUS_INGRESS_MALFORMED.
//   2. With a grant, an rpc_method or object outside the session-allowed set ->
//      DATA_ACCESS_SESSION_METHOD_NOT_ALLOWED.
//   3. The grant -> DATA_ACCESS_SESSION_GRANT_INVALID or
//      DATA_ACCESS_SESSION_GRANT_EXPIRED.
//   4. The request signature, over the digest the verifier rebuilds with its
//      own chain_id (typed chainId) and the request's signature_chain_id
//      (domain chainId) -> DATA_ACCESS_INVALID_SIGNATURE. The
//      chain_id field must also equal the verifier's own chain_id; a mismatch
//      is rejected here with DATA_ACCESS_INVALID_SIGNATURE even though it could
//      be detected earlier, never as a format error. This covers a wrong
//      derived grant hash, a tampered signature_chain_id, a chainId
//      string of another chain and a version 1 signature. On the no-grant
//      wallet branch it also covers the account check: requester_address
//      must be an existing account holding an eth_secp256k1 public key equal to
//      the recovered one. A stored key never changes, so a verifier may cache it
//      by address, but a cache miss it cannot fill is a rejection. On the
//      registered-key branch use the state/key, expiry and allowlist errors
//      above instead of comparing the session key with the owner's public key.
//   5. In order: builder_operator_address other than this Builder ->
//      DATA_ACCESS_DENIED; expiry_height outside
//      current_height <= expiry_height <= current_height + max_service_material_expiry_blocks,
//      with checked addition -> NEXUS_DATA_EXPIRED, and an unavailable chain
//      height is a rejection; replay; then a caller without the Task duty ->
//      DATA_ACCESS_DENIED.
// NEXUS_DATA_EXPIRED means the request itself expired and must be signed
// again; it is not the retention-expired DATA_EXPIRED of a stored object. The
// replay key uses the verifier's own chain_id.
message TaskDataRequestAuthV1 {
  uint32 schema_version = 1;
  string chain_id = 2;
  string builder_operator_address = 3;
  // Exactly the ASCII procedure called, /nexus.v1.IngressAPI/<Method>.
  string rpc_method = 4;
  string body_digest = 5;
  TaskDataRequesterKindV1 requester_kind = 6;
  string requester_address = 7;
  uint64 service_authorization_nonce = 8;
  bytes request_nonce = 9;
  // current_height <= expiry_height <= current_height + max_service_material_expiry_blocks.
  uint64 expiry_height = 10;
  // USER: 65 bytes R||S||V over the EIP-712 digest. CORTEX_SERVICE: 64 bytes R||S.
  bytes signature = 11;
  // USER only. Absent permits the wallet or the session's registered key.
  SessionGrantV1 session_grant = 12;
  // USER: EIP-712 domain chainId of signature, 1..MaxInt64. CORTEX_SERVICE: 0.
  uint64 signature_chain_id = 13;
}

// SessionGrantV1 lets a user's wallet authorize a short-lived client session
// key once, so that read and delivery-progress requests need no wallet prompt.
// It is always signed under the SDK Request EIP-712 domain (see
// SDKRequestEnvelopeV2), including when TaskDataRequestAuthV1 carries it, and
// never under the Task Data Request domain. The typed struct is
//
//   SessionGrant(string chainId,string user,address sessionKey,
//     uint64 expiryHeight,bytes32 grantNonce)
//
// whose fields project fields 1-5 in order: user as canonical Bech32 text,
// session_key as an EIP-712 address, grant_nonce as raw 32 bytes. A request
// that carries a grant binds it through sessionGrantHash = hashStruct(SessionGrant).
// The grant's domain chainId is its own signature_chain_id, chosen by the
// wallet when it signed; hashStruct carries no domain, so a grant and the
// requests under it may use different signature_chain_id values.
//
// A verifier rejects the grant unless:
//   - chain_id equals the verifier's own chain_id (whether the request's
//     chain_id field matches is checked at the signature step), and user
//     equals the request's signer (signer_address or requester_address);
//   - user_signature recovers over the SessionGrant signing digest, rebuilt with
//     signature_chain_id as the domain chainId, to user, user
//     is an existing on-chain account, and the recovered public key equals the
//     account's stored public key;
//   - current_height <= expiry_height <= current_height + max_session_grant_blocks,
//     with checked addition; a verifier that cannot read the chain height rejects.
//     max_session_grant_blocks is off-chain configuration that every Task
//     Builder must set to the same value;
//   - the request is in the session-allowed set: OpenTask, SubscribeOutput,
//     AckOutput, GetTaskEvents and PrepareChallenge on SDKRequestEnvelopeV2,
//     and GetTaskDataMetadata and FetchTaskData of an OUTPUT object on
//     TaskDataRequestAuthV1. Every other request must be signed by the wallet
//     directly and is rejected when it carries a grant;
//   - for OpenTask, user also equals the SignedOrder user_address, otherwise
//     SDK_AUTH_SESSION_GRANT_INVALID. This grant does not authorize orders;
//     order authorization is independent and requires the wallet or a key
//     separately registered on that session's StreamState.
//
// The request signature itself is compared only with session_key; no account
// public key is looked up for it. There is no revocation list: a grant is
// bounded only by its expiry, may be reused until then, and is not a replay
// record of its own. The session key is generated by the client, kept in memory
// only, and never derived from any signature.

// SDKRequestEnvelopeV2 authenticates a user request to Builder Ingress:
// OpenTask, SubscribeOutput, AckOutput, GetTaskEvents and PrepareChallenge. It
// carries no Task input, output or evidence.
//
// The signature is EIP-712 under the SDK Request domain
//
//   EIP712Domain(string name,string version,uint256 chainId)
//   name = "TrueOpen SDK Request", version = "1", chainId = signature_chain_id
//
// over the primary type
//
//   SDKRequest(string chainId,string method,string endpoint,bytes32 sessionId,
//     bytes32 taskId,bytes32 requestNonce,uint64 expiryHeightOrTime,
//     bytes32 bodyDigest,bytes32 sessionGrantHash)
//
// (one line in the real encodeType). Typed fields 1-8 are chain_id, method and
// endpoint as given; session_id and task_id strictly decoded to raw 32 bytes;
// request_nonce, exactly 32 bytes; expiry_height_or_time as uint64; and
// body_digest as raw 32 bytes. Anything that cannot be projected is rejected
// before a digest is built. sessionGrantHash is derived by the
// verifier: 32 zero bytes without session_grant, hashStruct(SessionGrant) with
// it. request_domain, signer_address, signature and signer_pubkey do not enter
// the typed data.
//
//   signing_digest = keccak256(0x19 || 0x01 || domain_separator || hash_struct)
//
// The digest is signed once, never hashed again, never as hex text and never
// through personal_sign, eth_sign or any EIP-191 prefix. A client holding the
// key signs the same digest directly; a browser wallet uses
// eth_signTypedData_v4.
//
// The domain chainId is signature_chain_id, chosen by the signer and carried in
// the envelope: a browser wallet uses its active network, so the user never
// switches networks, and a session key or server uses its SDK default. It must
// be in 1..MaxInt64. It isolates nothing: cross-chain isolation comes only from
// the typed chainId string, which the verifier takes from its own chain. The
// same request signed under another signature_chain_id has the same replay
// key; no identity, replay or dedup key may include the signature or
// signature_chain_id.
//
// Without session_grant, recovery to signer_address selects the wallet path,
// where the public key must equal the account's stored public key. Otherwise
// use the registered-key branch below. With
// session_grant the grant is verified as described on SessionGrantV1 and the
// signature must recover to its session_key. OpenTask accepts a grant whose
// user equals the SignedOrder user (see SessionGrantV1).
//
// Registered-key branch (no grant, recovered address differs from owner):
// first require the session named by session_id to exist and not be CLOSED,
// owner to equal signer_address, and recovery to equal its current key; then
// require current_height <= session_key_expiry_height; finally check the
// session method allowlist.
// State/key mismatch is SDK_AUTH_INVALID_SIGNATURE; disallowed method is
// SDK_AUTH_SESSION_METHOD_NOT_ALLOWED; expired key is
// SDK_AUTH_SESSION_GRANT_EXPIRED. sessionGrantHash remains 32 zero bytes.
// Requests do not consume spend_cap. Cache entries, including missing sessions
// and absent keys, carry a read height and expire after a configured block
// limit. Clear on event-stream disconnect, invalidate on session_key_updated,
// and fetch authoritative state on a miss; unavailable state rejects. Apply
// ingress rate limits to bound cache misses.
// OpenTask prechecks delegated order authorization before storing input. A
// nonzero cap failure is SDK_AUTH_SESSION_KEY_SPEND_CAP_EXCEEDED. Keeper remains
// final authority. A later assignment rejection emits RECORD_REJECTED; recovery
// checks committed sequence state before resigning the same unused sequence.
// Refresh the signing key after rotation, use the wallet after CLEAR, or renew
// the grant after expiry/cap failure. Local terminal-task retry recovery is a
// separate service implementation requirement, not a new wire field.
//
// The verifier runs five steps in order and stops at the first failure:
//   1. Format: session_id and task_id as 0x followed by 64 lowercase hex characters, a 32-byte
//      request_nonce, expiry_height_or_time above zero, endpoint matching
//      method, for OpenTask a chain-height expiry (below 10^12; a Unix
//      millisecond value is rejected here) and the derived task_id and
//      payload_ref, signer_address
//      (and the OpenTask body user_address) in canonical lowercase Bech32 with
//      the chain's account prefix, trueopen, decoding to exactly 20 bytes,
//      signature_chain_id (and the grant's) in 1..MaxInt64, and a body that
//      projects -> NEXUS_INGRESS_MALFORMED. A chain_id other than
//      the verifier's could be seen here but is not a format error; see step 4.
//   2. With session_grant, a method outside the session-allowed set ->
//      SDK_AUTH_SESSION_METHOD_NOT_ALLOWED.
//   3. With session_grant, a grant whose chain, user, user signature or stored
//      account key does not match, or for OpenTask whose user is not the
//      SignedOrder user -> SDK_AUTH_SESSION_GRANT_INVALID; a grant
//      outside its height window -> SDK_AUTH_SESSION_GRANT_EXPIRED.
//   4. The request signature, over the digest rebuilt with the sessionGrantHash
//      the verifier derives, recovering to anything but the expected address,
//      or a wallet-signed request whose account key does not match ->
//      SDK_AUTH_INVALID_SIGNATURE. A wrong grant hash shows up only here. The
//      verifier rebuilds the digest with its own chain_id (typed chainId),
//      never with the envelope's chain_id, and the envelope's
//      signature_chain_id (domain chainId), and
//      the envelope chain_id must equal the verifier's own chain_id. A request
//      signed for another chain, or whose chain_id field names another chain,
//      fails here with SDK_AUTH_INVALID_SIGNATURE.
//   5. Request expiry -> SDK_AUTH_EXPIRED; nonce replay -> SDK_AUTH_REPLAY.
//      An OpenTask chain-height expiry must satisfy
//      current_height <= expiry <= current_height + request_ttl_blocks, with
//      checked addition; request_ttl_blocks is Builder configuration, default 20.
// Steps 3 and 5 need the current chain height and reject when it is unavailable.
// An account public key never changes once stored, so a verifier may cache it
// by address, but a cache miss it cannot fill is a rejection.
//
// body_digest is H_FIELDS_V1 under the body domain of the method called:
// TRUEOPEN_SDK_BODY_OPEN_TASK_V1, TRUEOPEN_SDK_BODY_SUBSCRIBE_OUTPUT_V1,
// TRUEOPEN_SDK_BODY_ACK_OUTPUT_V1, TRUEOPEN_SDK_BODY_GET_TASK_EVENTS_V1 or
// TRUEOPEN_SDK_BODY_PREPARE_CHALLENGE_V1 (registry/v1/domains.json lists the
// fields).
//
// Replay key: request_domain \x00 chain_id \x00 signer_address \x00 hex(request_nonce),
// where chain_id is the verifier's own chain_id, not the envelope field.
// A session-key request is still keyed by signer_address, the granting user.

// OpenTaskHeader opens a Task. request_envelope is signed by the user's wallet
// directly, recovering to user_address, or by a session key under a grant whose
// user is user_address, or the session's registered key. user_address must
// equal the SignedOrder user. That
// account must already hold its public key on chain (the user has submitted
// MsgCreateSession); otherwise the
// request is rejected with SDK_AUTH_INVALID_SIGNATURE. The order itself is
// authorized only by the SignedOrder EIP-712 wallet or registered-key signature, which the Keeper
// verifies; there is no outer order signature.
//
// expiry_height_or_time on request_envelope must be a chain height (below
// 10^12); a Unix millisecond value is rejected at the format step with
// NEXUS_INGRESS_MALFORMED. The height must satisfy
// current_height <= expiry <= current_height + request_ttl_blocks, with checked
// addition. request_ttl_blocks is Builder configuration with a default of 20
// blocks. Outside the window the request is rejected with SDK_AUTH_EXPIRED; a
// Builder that cannot read the current chain height rejects the request.
//
// body_digest is H_FIELDS_V1("TRUEOPEN_SDK_BODY_OPEN_TASK_V1", task_hash,
// session_id, order_sequence, user_address, input_size_bytes, input_hash,
// input_media_type, idempotency_key), where task_hash is recomputed from the
// SignedOrderV2 in order_envelope and never taken from the caller. The
// order_envelope bytes do not enter the body. The envelope task_id must equal
// TRUEOPEN_TASK_ID_V1(session_id, order_sequence).
message OpenTaskHeader {
  // The complete signed SignedOrderV2 as protobuf bytes; the older JSON order
  // envelope is not accepted.
  bytes order_envelope = 1;
  // Must equal "nexus://sha256/" || lowercase_hex(input_hash). It is derived
  // from the signed input_hash, checked here, and enters no preimage.
  string payload_ref = 2;
  reserved 3;
  reserved "signature";
  SDKRequestEnvelopeV2 request_envelope = 4;
  string session_id = 5;
  uint64 order_sequence = 6;
  // Canonical lowercase Bech32 with the chain's account prefix, trueopen,
  // decoding to exactly 20 bytes; anything else is NEXUS_INGRESS_MALFORMED at
  // the format step. Must equal the SignedOrder user.
  string user_address = 7;
  reserved 8;
  reserved "signature_scheme";
  uint64 input_size_bytes = 9;
  string input_hash = 10;
  string input_media_type = 11;
  // Exact-retry key of one logical OpenTask. A retry under the same key returns
  // the first result only when task_hash, input_hash and input_size_bytes are
  // all equal, and is rejected otherwise. The SignedOrder signature metadata
  // (signature_scheme, user_signature, signature_chain_id) is not compared: a
  // retry re-signed under another wallet network is the same request, but its
  // signature is verified on its own and the stored SignedOrder is kept. A
  // replacement (RBF) version must use a new key.
  string idempotency_key = 12;
}

// OpenTaskRequest defines the OpenTaskRequest wire type.
message OpenTaskRequest {
  // frame selects one supported variant.
  oneof frame {
    OpenTaskHeader header = 1;
    bytes chunk = 2;
  }
}

// OpenTaskResponse defines the OpenTaskResponse wire type.
message OpenTaskResponse {
  string task_id = 1;
  bool accepted = 2;
  string reason = 3;
  string session_id = 4;
  TaskDataObjectMetadataV1 input_metadata = 5;
  BuilderStorageConfirmationV1 input_confirmation = 6;

  OpenTaskStatusV1 status = 7;
  optional DispatchResultHeaderV1 dispatch_result = 8;
  optional string bound_builder = 9;
  optional uint64 takeover_activation_height = 10;
}

// The upload body includes size_bytes and media_type.
// UploadTaskResultObjectHeaderV1 defines the UploadTaskResultObjectHeaderV1 wire type.
message UploadTaskResultObjectHeaderV1 {
  TaskDataObjectRefV1 object_ref = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
  TaskDataRequestAuthV1 request_auth = 4;
}

// UploadTaskResultObjectRequest defines the UploadTaskResultObjectRequest wire type.
message UploadTaskResultObjectRequest {
  // frame selects one supported variant.
  oneof frame {
    UploadTaskResultObjectHeaderV1 header = 1;
    bytes chunk = 2;
  }
}

// UploadTaskResultObjectResponse defines the UploadTaskResultObjectResponse wire type.
message UploadTaskResultObjectResponse {
  bool accepted = 1;
  bool idempotent = 2;
  TaskDataObjectMetadataV1 metadata = 3;
}

//
// OutputStreamHeaderV2 binds the plaintext stream declaration to the selected
// Worker's service key, independently of the upload request authorization.
// worker_signature signs H_FIELDS_V1("TRUEOPEN_OUTPUT_STREAM_HEADER_V1",
// chain_id, task_hash, dispatch_ticket_hash, stream_instance, user_recipient_pubkey,
// output_key_commitment, key_package_hash).
message OutputStreamHeaderV2 {
  string session_id = 1;
  string task_id = 2;
  string task_hash = 3;
  TaskDataRequestAuthV1 request_auth = 4;
  // The plaintext stream uses stream_instance 1 and a ticket-bound attempt.

  reserved 5;
  reserved "attempt";
  uint32 stream_instance = 6;
  // Phase 0 requires this field to be empty.
  bytes user_recipient_pubkey = 7;
  // Phase 0 requires these commitments to be 32 zero bytes.
  bytes output_key_commitment = 8;
  bytes key_package_hash = 9;
  // Raw64 R||S low-S signature over the header declaration.
  bytes worker_signature = 10;

  bytes dispatch_ticket_hash = 11;
}

//
// OutputChunkV1 defines the OutputChunkV1 wire type.
message OutputChunkV1 {
  uint64 seq = 1;
  bytes text = 2;
  bytes mmr_root = 3;
  bytes worker_signature = 4;
  // Phase 0 requires this field to be empty; any non-empty value fails closed.
  // A future activation requires a new domain, limits, vectors and Wire release.
  bytes attachment = 5;
  // Phase 0 requires this field to be empty together with attachment.
  bytes attachment_signature = 6;

  // Cumulative generated tokens through this chunk; non-decreasing across the attempt.
  // Used for the pre-record forwarding cap, never counted again by the Builder.
  uint64 cumulative_generated_tokens = 7;
  // Must equal the stream header's ticket. The Worker signs
  // H_FIELDS_V1("TRUEOPEN_OUTPUT_CHUNK_V1", chain_id, task_hash,
  // dispatch_ticket_hash, seq, mmr_root). Attempts of one order cannot mix.
  bytes dispatch_ticket_hash = 8;
}

//
// OutputFinV1 defines the OutputFinV1 wire type.
message OutputFinV1 {
  uint64 final_seq = 1;
  bytes output_mmr_root = 2;
  task.v1.FinishReasonV1 finish_reason = 3;
  bytes worker_signature = 4;
  // Must equal the stream header and accepted receipt's ticket. The Worker signs
  // H_FIELDS_V1("TRUEOPEN_OUTPUT_FIN_V1", chain_id, task_hash,
  // dispatch_ticket_hash, final_seq, output_mmr_root, finish_reason).
  bytes dispatch_ticket_hash = 5;
}

// UploadTaskOutputStreamRequest defines the UploadTaskOutputStreamRequest wire type.
message UploadTaskOutputStreamRequest {
  // frame selects one supported variant.
  oneof frame {
    OutputStreamHeaderV2 header = 1;
    OutputChunkV1 chunk = 2;
    OutputFinV1 fin = 3;
  }
}

// OutputStreamProgressV1 defines the OutputStreamProgressV1 wire type.
message OutputStreamProgressV1 {
  optional uint64 last_seq = 1;
  bytes mmr_root = 2;
  bool last_frame_short = 3;
}

// OutputStreamResultV1 defines the OutputStreamResultV1 wire type.
message OutputStreamResultV1 {
  reserved 5;
  reserved "storage_confirmation";

  bool accepted = 1;
  uint64 last_seq = 2;
  bytes output_mmr_root = 3;
  uint64 leaf_count = 4;
}

// UploadTaskOutputStreamResponse defines the UploadTaskOutputStreamResponse wire type.
message UploadTaskOutputStreamResponse {
  // reply selects one supported variant.
  oneof reply {
    OutputStreamProgressV1 progress = 1;
    OutputStreamResultV1 result = 2;
  }
}

// GetTaskDataMetadataRequest defines the GetTaskDataMetadataRequest wire type.
// A USER request_auth may carry a session grant only for an OUTPUT object.
message GetTaskDataMetadataRequest {
  TaskDataObjectRefV1 object_ref = 1;
  TaskDataRequestAuthV1 request_auth = 2;
}

// GetTaskDataMetadataResponse defines the GetTaskDataMetadataResponse wire type.
message GetTaskDataMetadataResponse {
  TaskDataObjectMetadataV1 metadata = 1;
  EvidenceBundleSummaryV1 evidence_bundle = 2;
  task.v1.InferReceiptV3 infer_receipt = 3;
  uint64 retain_until_height = 4;
}

// FetchTaskDataRequest defines the FetchTaskDataRequest wire type.
// A USER request_auth may carry a session grant only for an OUTPUT object.
message FetchTaskDataRequest {
  TaskDataObjectRefV1 object_ref = 1;
  optional ByteRangeV1 range = 2;
  TaskDataRequestAuthV1 request_auth = 3;
}

// FetchTaskDataHeaderV1 defines the FetchTaskDataHeaderV1 wire type.
message FetchTaskDataHeaderV1 {
  TaskDataObjectRefV1 object_ref = 1;
  uint64 total_size_bytes = 2;
  string media_type = 3;
  ByteRangeV1 served_range = 4;
}

// FetchTaskDataChunkV1 defines the FetchTaskDataChunkV1 wire type.
message FetchTaskDataChunkV1 {
  uint64 offset = 1;
  bytes data = 2;
  bool eof = 3;
}

// FetchTaskDataResponse defines the FetchTaskDataResponse wire type.
message FetchTaskDataResponse {
  // frame selects one supported variant.
  oneof frame {
    FetchTaskDataHeaderV1 header = 1;
    FetchTaskDataChunkV1 chunk = 2;
  }
}

// The finalize body binds task_id, infer_receipt_hash, and SHA256(receipt.service_signature).
// FinalizeTaskResultRequest defines the FinalizeTaskResultRequest wire type.
message FinalizeTaskResultRequest {
  string task_hash = 1;
  string session_id = 2;
  string task_id = 3;
  task.v1.InferReceiptV3 receipt = 4;
  TaskDataRequestAuthV1 request_auth = 5;
  // Selects exactly one Worker A-level or B-level evidence bundle.
  shared.v1.EvidenceKind evidence_kind = 6;
}

// FinalizeTaskResultResponse defines the FinalizeTaskResultResponse wire type.
message FinalizeTaskResultResponse {
  bool accepted = 1;
  bool idempotent = 2;
  BuilderStorageConfirmationV1 output_confirmation = 3;
  repeated BuilderStorageConfirmationV1 evidence_bundle_confirmations = 4;
}

// task_hash / verify_round / verifier_evidence_bundle_hash / manifest size and manifest
// task_id, verify_round, verifier_operator, result_receipt_signing_digest,
// The verifier finalize body binds SHA256(receipt.service_signature).
// FinalizeVerifierEvidenceRequest defines the FinalizeVerifierEvidenceRequest wire type.
message FinalizeVerifierEvidenceRequest {
  string task_hash = 1;
  string session_id = 2;
  string task_id = 3;
  uint32 verify_round = 4;
  string verifier_operator = 5;
  task.v1.ResultReceiptV3 receipt = 6;
  TaskDataRequestAuthV1 request_auth = 7;
}

// FinalizeVerifierEvidenceResponse defines the FinalizeVerifierEvidenceResponse wire type.
message FinalizeVerifierEvidenceResponse {
  bool accepted = 1;
  bool idempotent = 2;
  BuilderStorageConfirmationV1 evidence_bundle_confirmation = 3;
}

// SubmitInferReceiptRequest defines the SubmitInferReceiptRequest wire type.
message SubmitInferReceiptRequest {
  task.v1.InferReceiptV3 receipt = 1;
}

// SubmitInferReceiptResponse defines the SubmitInferReceiptResponse wire type.
message SubmitInferReceiptResponse {
  reserved 4;
  reserved "output_storage_confirmation";

  bool relay_accepted = 1;
  string infer_receipt_hash = 2;
  bool idempotent = 3;
}

// SubmitVerifyCommitRequest defines the SubmitVerifyCommitRequest wire type.
message SubmitVerifyCommitRequest {
  task.v1.VerifyCommitV1 commit = 1;
}

// SubmitVerifyCommitResponse defines the SubmitVerifyCommitResponse wire type.
message SubmitVerifyCommitResponse {
  bool relay_accepted = 1;
  string commit_key = 2;
  string verify_commit_signing_digest = 3;
  bool idempotent = 4;
}

// SubmitVerifyResultRequest defines the SubmitVerifyResultRequest wire type.
message SubmitVerifyResultRequest {
  task.v1.ResultReceiptV3 receipt = 1;
}

// SubmitVerifyResultResponse defines the SubmitVerifyResultResponse wire type.
message SubmitVerifyResultResponse {
  bool relay_accepted = 1;
  string result_receipt_signing_digest = 2;
  string result_payload_hash = 3;
  bool idempotent = 4;
}

// SubscribeOutputRequest defines the SubscribeOutputRequest wire type.
// body_digest is H_FIELDS_V1("TRUEOPEN_SDK_BODY_SUBSCRIBE_OUTPUT_V1", session_id,
// task_id, OPTIONAL_V1(resume_after_seq), OPTIONAL_V1(dispatch_ticket_hash)).
// Unset is absent, and a set zero is present zero.
// A session key may sign this request.
message SubscribeOutputRequest {
  string session_id = 1;
  string task_id = 2;
  SDKRequestEnvelopeV2 request_envelope = 3;
  optional uint64 resume_after_seq = 4;

  optional bytes dispatch_ticket_hash = 5;
}

//
// SubscribeOutputResponse defines the SubscribeOutputResponse wire type.
message SubscribeOutputResponse {
  reserved 1, 2, 3, 4, 5, 6, 7;
  reserved "output_id", "session_id", "task_id", "output_text", "output_hash", "created_at", "expires_at";
  // frame selects one supported variant.
  oneof frame {
    OutputChunkV1 chunk = 8;
    OutputFinV1 fin = 9;
  }

  optional DispatchResultHeaderV1 dispatch_result = 10;
}

//
// Acknowledgement uses the frozen output stream identity and sequence.
// AckOutputRequest defines the AckOutputRequest wire type.
// body_digest is H_FIELDS_V1("TRUEOPEN_SDK_BODY_ACK_OUTPUT_V1", session_id,
// task_id, last_seq). A session key
// may sign this request.
message AckOutputRequest {
  string session_id = 1;
  string task_id = 2;
  reserved 3;
  reserved "output_id";
  SDKRequestEnvelopeV2 request_envelope = 4;
  uint64 last_seq = 5;
}

// AckOutputResponse defines the AckOutputResponse wire type.
message AckOutputResponse {
  bool acked = 1;
  bool already_acked = 2;
  int64 acked_at = 3;
}

// GetTaskEventsRequest defines the GetTaskEventsRequest wire type.
// body_digest is H_FIELDS_V1("TRUEOPEN_SDK_BODY_GET_TASK_EVENTS_V1", session_id,
// task_id, OPTIONAL_V1(from_cursor as uint64)). An empty from_cursor is absent;
// otherwise it must be unsigned decimal without leading zeros and at most
// 2^64-1 ("0" is valid) and is present, and anything else is rejected. A session
// key may sign this request.
message GetTaskEventsRequest {
  string session_id = 1;
  string task_id = 2;
  string from_cursor = 3;
  SDKRequestEnvelopeV2 request_envelope = 4;
}

// GetTaskEventsResponse reports Nexus lifecycle events, separate from the Node
// ProtocolEventCodeV1 registry. The closed event_code set is:
//   ORDER_RECEIVED, DISPATCH_ACCEPTED, NO_CAPACITY, DISPATCH_RECORDED, RECORD_REJECTED,
//   TAKEOVER_PENDING, TAKEOVER_RECORDED, TAKEOVER_VOIDED,
//   TASK_FAILED, ORDER_EXPIRED, ASSIGN_TIMEOUT, OPEN_VERIFY_ACCEPTED, SAMPLE_READY,
//   WORKER_REVEAL_ACCEPTED, FULL_RESULT_REVEAL_ACCEPTED, SETTLE_ACCEPTED,
//   OUTPUT_REF_RECEIVED, SWEEP_OBSERVED, TASK_CLOSED, TASK_RECOVERED.
// Acceptance/receipt events describe observed progress, never replacement chain
// authority. In particular OUTPUT_REF_RECEIVED is the Worker's signed receipt.
message GetTaskEventsResponse {
  string cursor = 1;
  string state = 2;
  string task_phase = 3;
  string event_code = 4;
  int64 chain_height = 5;
  optional TaskEventDetailV1 detail = 6;
}

// TaskEventDetailV1 carries event-local routing and rejection facts so the SDK
// can recover without resubmitting OpenTask. Addresses identify stable operators.
// TAKEOVER_PENDING supplies candidate + activation height; TAKEOVER_RECORDED
// supplies bound_builder. TAKEOVER_VOIDED caused by recording supplies the
// recording Builder + recorded task ID; cancellation/closure need no destination.
// DISPATCH_ACCEPTED and RECORD_REJECTED supply the ticket; the former supplies
// worker_operator_address and the latter its nonzero rejection category.
message TaskEventDetailV1 {
  optional string bound_builder = 1;
  optional string recording_builder = 2;
  optional bytes recorded_task_id = 3;
  optional string candidate_builder = 4;
  optional uint64 takeover_activation_height = 5;
  optional bytes dispatch_ticket_hash = 6;
  optional task.v1.DispatchRejectCodeV1 reject_code = 7;
  optional string worker_operator_address = 8;
}

// PrepareChallengeRequest defines the PrepareChallengeRequest wire type.
// body_digest is H_FIELDS_V1("TRUEOPEN_SDK_BODY_PREPARE_CHALLENGE_V1", session_id,
// task_id, challenge_kind, OPTIONAL_V1(local_evidence_digest)). An empty
// local_evidence_digest is absent; otherwise it must be exactly 32 bytes and is
// present, and any other length is rejected. A session key may sign this request.
message PrepareChallengeRequest {
  string session_id = 1;
  string task_id = 2;
  string challenge_kind = 3;
  bytes local_evidence_digest = 4;
  SDKRequestEnvelopeV2 request_envelope = 5;
}

// PrepareChallengeResponse defines the PrepareChallengeResponse wire type.
message PrepareChallengeResponse {
  bool challenge_open = 1;
  uint64 challenge_close_height = 2;
  repeated string required_evidence = 3;
  Coin estimated_bond = 4;
  uint64 estimated_gas = 5;
}

// Coin defines the Coin wire type.
message Coin {
  string denom = 1;
  string amount = 2;
}

// GetTaskStatusRequest defines the GetTaskStatusRequest wire type.
message GetTaskStatusRequest {
  string task_id = 1;
  string session_id = 2;
}

//
// GetTaskStatusResponse defines the GetTaskStatusResponse wire type.
message GetTaskStatusResponse {
  string state = 1;
  string stage = 2;
  string set_id = 3;
  int64 updated_at = 4;
  string task_phase = 5;
}

// ResumeOutputResponse reuses the single output stream frame contract.
message ResumeOutputResponse {
  SubscribeOutputResponse frame = 1;
}
