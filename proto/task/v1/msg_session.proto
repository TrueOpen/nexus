syntax = "proto3";
package task.v1;

import "shared/v1/amount.proto";
import "shared/v1/common.proto";
import "task/v1/params.proto";
import "task/v1/session.proto";

option go_package = "github.com/TrueOpen/nexus/gen/trueopen/task/v1;taskv1";

// MsgUpdateTaskParams updates the Task module parameters.
// The expected-version compare and grouped TaskParamsV1 body are frozen by
// the wire API. The response returns the newly committed version and hash.
// MsgUpdateTaskParams defines the MsgUpdateTaskParams wire type.
message MsgUpdateTaskParams {
  uint64 expected_version = 1;
  TaskParamsV1 params = 2;
  string authority = 3;
}

// MsgUpdateTaskParamsResponse defines the response structure for executing a
// MsgUpdateTaskParams message.
// MsgUpdateTaskParamsResponse defines the MsgUpdateTaskParamsResponse wire type.
message MsgUpdateTaskParamsResponse {
  uint64 new_version = 1;
  bytes params_hash = 2;
  shared.v1.MutationStatusV1 status = 3;
}

// MsgCreateSession opens one session namespace and locks its owner
// (the wire API). The optional grant registers a session signing key. The
// nonce comes from SessionNonceState and session_id is derived on
// chain by TRUEOPEN_SESSION_V1. initial_deposit funds the session escrow and
// initial_builder fixes the first dispatch binding. No unbounded metadata is accepted.
// MsgCreateSession defines the MsgCreateSession wire type.
message MsgCreateSession {
  string signer_address = 1;
  SessionKeyGrantV1 session_key = 2;

  shared.v1.Amount initial_deposit = 3;
  string initial_builder = 4;
}

// MsgUpdateSessionKey changes authorization for an ACTIVE or IDLE session.
// Only its owner signs this transaction. Exactly one action is required.
// SET preserves spent; a different key or SET after CLEAR records the execution
// height as set_height. Same-key renewal/cap changes preserve set_height.
// CLEAR zeroes key, expiry, cap and set_height, but never spent. An unchanged
// result is NOOP without an event. Lifecycle status and activity are unchanged.
// Restrictive updates register pending changes. Existing authorization remains
// effective until effective_height; only nonrestrictive same-key renewal is immediate.
// Already admitted tasks retain their authorization and escrow.
message MsgUpdateSessionKey {
  string signer_address = 1;
  bytes session_id = 2;
  // action selects registration/renewal or explicit revocation.
  oneof action {
    SessionKeyGrantV1 set = 3;
    ClearSessionKeyV1 clear = 4;
  }
}

// MsgUpdateSessionKeyResponse returns the committed authorization and result.
// An absent session_key_or_empty means no key; spent survives revocation.
message MsgUpdateSessionKeyResponse {
  optional bytes session_key_or_empty = 1;
  uint64 expiry_height = 2;
  shared.v1.Amount spend_cap = 3;
  shared.v1.Amount spent = 4;
  uint64 set_height = 5;
  shared.v1.MutationStatusV1 status = 6;

  optional uint64 effective_height = 7;
  optional PendingSessionKeyChangeV1 pending_change = 8;
}

// MsgCreateSessionResponse returns the chain-derived session identity
//. Clients may also recompute session_id off chain from the same
// formula; the owner is not derivable from session_id, hence StreamState still
// stores it.
// MsgCreateSessionResponse defines the MsgCreateSessionResponse wire type.
message MsgCreateSessionResponse {
  bytes session_id = 1;
  uint64 session_nonce = 2;
  shared.v1.MutationStatusV1 status = 3;
}

// MsgCancelOrder skips the next unconsumed order sequence so an off-chain order
// stops occupying it. signer_address is the Cosmos signer and
// must equal the stream owner; no duplicate detached owner signature is required.
// It may only cancel next_expected_sequence, never a sequence already accepted by
// MsgRecordDispatch, and it moves no funds.
// MsgCancelOrder defines the MsgCancelOrder wire type.
message MsgCancelOrder {
  bytes session_id = 1;
  uint64 order_sequence = 2;
  string signer_address = 3;
}

// MsgCancelOrderResponse reports the cancelled sequence and the advanced counter
//. task_id stays empty because a cancelled sequence never created a task.
// MsgCancelOrderResponse defines the MsgCancelOrderResponse wire type.
message MsgCancelOrderResponse {
  bytes task_id = 1;
  uint64 cancelled_sequence = 2;
  uint64 next_expected_sequence = 3;
  shared.v1.MutationStatusV1 status = 4;

  uint64 cancel_effective_height = 5;
}

// REMOVED: MsgUpdateTimeoutBucket / MsgUpdateTimeoutBucketResponse. They lived in
// this file but belong to the bucket domain, and their response referenced
// TimeoutBucketState, which the bucket owner has already deleted. the wire API
// freezes the replacement as
// `MsgUpdateTimeoutBucket{1=update:TimeoutBucketUpdateV1,2=authority:Address}`;
// it must be re-registered by the owner of the timeout bucket wire, not
// here. The governed ReferenceBucket path is gone entirely, so
// the replacement takes no shape from it.

// MsgDepositSession defines the canonical MsgDepositSession fields.
message MsgDepositSession {
  bytes session_id = 1;
  shared.v1.Amount amount = 2;
  string signer_address = 3;
}
// MsgDepositSessionResponse defines the canonical MsgDepositSessionResponse fields.
message MsgDepositSessionResponse {
  shared.v1.Amount balance = 1;
  shared.v1.MutationStatusV1 status = 2;
}
// WithdrawAmountV1 defines the canonical WithdrawAmountV1 fields.
message WithdrawAmountV1 {
  shared.v1.Amount amount = 1;
}
// CloseSessionV1 defines the canonical CloseSessionV1 fields.
message CloseSessionV1 {}
// MsgWithdrawSession registers one delayed withdrawal or close.
message MsgWithdrawSession {
  bytes session_id = 1;
  string signer_address = 2;

  // action selects either a fixed amount or full close.
  oneof action {
    WithdrawAmountV1 amount = 3;
    CloseSessionV1 close = 4;
  }
}
// MsgWithdrawSessionResponse defines the canonical MsgWithdrawSessionResponse fields.
message MsgWithdrawSessionResponse {
  uint64 effective_height = 1;
  shared.v1.Amount pending_amount = 2;
  shared.v1.MutationStatusV1 status = 3;
}
