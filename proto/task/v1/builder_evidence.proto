syntax = "proto3";
package task.v1;


option go_package = "github.com/TrueOpen/nexus/gen/trueopen/task/v1;taskv1";

// StreamMessageKind is the closed StreamMessageKind registry.
enum StreamMessageKind {
  // UNSPECIFIED is the unspecified value.
  STREAM_MESSAGE_KIND_UNSPECIFIED = 0;
  // OPEN_VERIFY is the open verify value.
  STREAM_MESSAGE_KIND_OPEN_VERIFY = 1;
  // VERIFIER_ASSIGNMENT_NOTIFY is the verifier assignment notify value.
  STREAM_MESSAGE_KIND_VERIFIER_ASSIGNMENT_NOTIFY = 2;
}
// BuilderProtocolViolation defines the BuilderProtocolViolation contract.
enum BuilderProtocolViolation {
  // Never accepted as a protocol violation.
  // BUILDER_PROTOCOL_VIOLATION_UNSPECIFIED identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_UNSPECIFIED = 0;
  // Envelope identifies a task outside the signed duty scope.
  // BUILDER_PROTOCOL_VIOLATION_WRONG_TASK_SCOPE identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_WRONG_TASK_SCOPE = 1;
  // Envelope kind and declared task stage disagree.
  // BUILDER_PROTOCOL_VIOLATION_WRONG_STAGE identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_WRONG_STAGE = 2;
  // NON-ACTIVE in V1. Envelope references a BuilderSet other than the task's
  // frozen set.
  // BUILDER_PROTOCOL_VIOLATION_WRONG_BUILDER_SET identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_WRONG_BUILDER_SET = 3;
  // NON-ACTIVE in V1. Envelope carries a bitmap outside its unique canonical
  // encoding.
  // BUILDER_PROTOCOL_VIOLATION_NON_CANONICAL_BITMAP identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_NON_CANONICAL_BITMAP = 4;
  // NON-ACTIVE in V1. Envelope attempts to clear an already accepted monotonic
  // bit.
  // BUILDER_PROTOCOL_VIOLATION_BIT_CLEAR_ATTEMPT identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_BIT_CLEAR_ATTEMPT = 5;
  // NON-ACTIVE in V1. Envelope conflicts with immutable material already
  // accepted for its key.
  // BUILDER_PROTOCOL_VIOLATION_CONFLICTING_ACCEPTED_MATERIAL identifies the corresponding protocol value.
  BUILDER_PROTOCOL_VIOLATION_CONFLICTING_ACCEPTED_MATERIAL = 6;
}

// DataUnavailableStateReferenceV1 defines the DataUnavailableStateReferenceV1 contract.
message DataUnavailableStateReferenceV1 {
  // Charged task, raw32; also the scope_id of the derived fact.
  bytes task_id = 1;
  // Must be 1. Zero is invalid/unspecified and any other round fails closed
  // without producing a Builder fault.
  uint32 verify_round = 2;
  // Stable Builder operator charged by the aggregate; never a service address.
  string builder_operator = 3;
}

// MsgSubmitBuilderEvidence defines the MsgSubmitBuilderEvidence contract.
message MsgSubmitBuilderEvidence {
  bytes evidence_bytes = 1;
  string submitter_address = 2;
}

// SignedMessageEquivocationV2 defines the canonical SignedMessageEquivocationV2 fields.
message SignedMessageEquivocationV2 {
  StreamMessageKind message_kind = 1;
  bytes message_a = 2;
  bytes message_b = 3;
}
// SignedMessageProtocolFaultV2 defines the canonical SignedMessageProtocolFaultV2 fields.
message SignedMessageProtocolFaultV2 {
  StreamMessageKind message_kind = 1;
  bytes message = 2;
  BuilderProtocolViolation violation = 3;
}
// BuilderEvidenceV2 carries exact typed stream-message bytes, not a transport envelope.
// Strict decoding rejects unknown fields, duplicate singular fields and oneof conflicts.
message BuilderEvidenceV2 {
  uint32 schema_version = 1;
  reserved 4;

  // evidence selects exactly one supported proof.
  oneof evidence {
    SignedMessageEquivocationV2 equivocation = 2;
    SignedMessageProtocolFaultV2 invalid_stage_submission = 3;
    DataUnavailableStateReferenceV1 data_unavailable = 5;
  }
}
