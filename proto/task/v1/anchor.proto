syntax = "proto3";
package task.v1;

import "shared/v1/common.proto";

option go_package = "github.com/TrueOpen/nexus/gen/trueopen/task/v1;taskv1";

// AnchorVerdictV1 is the verdict of the anchor commitment audit (ADR-0040) on
// one sampled position, or on the whole task after all positions are judged.
// AnchorVerdictV1 defines the AnchorVerdictV1 wire type.
enum AnchorVerdictV1 {
  // ANCHOR_VERDICT_V1_UNSPECIFIED identifies the corresponding protocol value.
  ANCHOR_VERDICT_V1_UNSPECIFIED = 0;
  // Every anchor, recurrent-state recomputation, direction statistic, glue row
  // and token rule holds at the position.
  ANCHOR_VERDICT_V1_PASS = 1;
  // At least one rule failed at the position: the Worker did not compute it
  // with the registered weights under the registered precision class.
  ANCHOR_VERDICT_V1_REJECT = 2;
  // The auditor could not judge the position (missing material, proof not
  // established); attributable to the verifier, never to the Worker.
  ANCHOR_VERDICT_V1_NO_VERDICT = 3;
}

// AnchorPositionVerdictV1 is the auditor's verdict on one sampled position.
// AnchorPositionVerdictV1 defines the AnchorPositionVerdictV1 wire type.
message AnchorPositionVerdictV1 {
  uint64 position = 1;
  AnchorVerdictV1 verdict = 2;
  // Short diagnostic (rule name and statistic); informational, not consensus.
  string reason = 3;
}

// AnchorResultSourceV1 names who finalized the anchor verdict of a task.
enum AnchorResultSourceV1 {
  // No final verdict yet.
  ANCHOR_RESULT_SOURCE_V1_UNSPECIFIED = 0;
  // A selected round-1 Verifier's MsgSubmitAnchorAuditResult (ADR-0040 v1; advisory since v4).
  ANCHOR_RESULT_SOURCE_V1_VERIFIER = 1;
  // Consensus validators reached >= 2/3 of the last bonded voting power on one verdict (v4).
  ANCHOR_RESULT_SOURCE_V1_VALIDATOR_VOTE = 2;
  // verdict_deadline_height passed without a final vote: REJECT when the Worker never
  // opened or never proved, NO_VERDICT when the validators did not reach 2/3 on a proof.
  ANCHOR_RESULT_SOURCE_V1_TIMEOUT = 3;
  // The receipt's commitments could not be sampled (malformed token commitment);
  // the audit is final REJECT at sampling (ADR-0040 v6).
  ANCHOR_RESULT_SOURCE_V1_INVALID_COMMITMENT = 4;
}

// AnchorVoteTallyV1 is the running validator-vote tally of one anchor audit, in
// units of staking voting power as of the last validator-set update.
message AnchorVoteTallyV1 {
  // pass_power is the summed voting power of PASS votes.
  uint64 pass_power = 1;
  // reject_power is the summed voting power of REJECT votes.
  uint64 reject_power = 2;
  // no_verdict_power is the summed voting power of NO_VERDICT votes.
  uint64 no_verdict_power = 3;
  // total_power is the last total bonded voting power at the latest vote.
  uint64 total_power = 4;
  // vote_count is the number of recorded votes.
  uint32 vote_count = 5;
}

// AnchorValidatorVoteState is one bonded validator's vote on a Worker's anchor proof.
message AnchorValidatorVoteState {
  bytes task_id = 1;
  string validator_operator_address = 2;
  string voter_address = 3;
  AnchorVerdictV1 verdict = 4;
  bytes proof_hash = 5;
  uint64 height = 6;
  uint64 power = 7;
  repeated AnchorPositionVerdictV1 verdicts = 8;
}

// AnchorAuditState is the per-task record of the anchor commitment audit
// (ADR-0040, first slice): the positions the chain sampled from the beacon,
// the Worker's opening hash and the auditor's verdicts. The anchor commitment
// itself is the WORKER_ANCHOR_OPENING entry of the accepted InferReceipt.
// AnchorAuditState defines the AnchorAuditState wire type.
message AnchorAuditState {
  bytes task_id = 1;
  // Whether the beacon selected this task for an opening.
  bool sampled = 2;
  // Sampled positions, strictly ascending, each in [0, rows).
  repeated uint64 positions = 3;
  // Randomness the sample was derived from.
  bytes sample_beacon = 4;
  uint64 sample_height = 5;
  // Opening material hash (sha256 of the exact bytes) once the Worker opened.
  bytes opening_hash = 6;
  uint64 opening_size_bytes = 7;
  // Where the material can be fetched; devnet accepts file:// and http(s)://.
  string opening_uri = 8;
  uint64 opening_height = 9;
  string result_verifier_operator_address = 10;
  repeated AnchorPositionVerdictV1 verdicts = 11;
  // sha256 of the proof package (zero bytes when the auditor recomputed
  // directly with the weights instead of proving).
  bytes proof_hash = 12;
  uint64 result_height = 13;
  AnchorVerdictV1 task_verdict = 14;
  // Worker-produced proof package covering the sampled positions (ADR-0040
  // v2: the Worker proves on its own CPU while it keeps serving; a Verifier
  // checks the proof without the weights). Zero/empty until submitted.
  bytes worker_proof_hash = 15;
  uint64 worker_proof_size_bytes = 16;
  string worker_proof_uri = 17;
  uint64 worker_proof_height = 18;
  // Captured at sampling so the audit outlives the task's receipt and
  // assignment records (which the chain prunes once the task is terminal).
  string winner_worker = 19;
  repeated string selected_verifiers = 20;
  // Height by which a final verdict must exist; settlement of a PASS round waits until
  // then (or until the validators finalize earlier). Zero on audits sampled before v4.
  uint64 verdict_deadline_height = 21;
  AnchorResultSourceV1 result_source = 22;
  AnchorVoteTallyV1 tally = 23;
  string result_reason = 24;
  // Role-fault id of the Worker slash applied at settlement on a REJECT verdict.
  bytes worker_fault_id = 25;
  // Audit probability of this task in basis points (ADR-0040 v5): derived at sampling
  // from the order value R and the Worker's slashable bond D = active_bond * anchor_reject_slash_bps:
  // s = k*R / (D + k*R), floored at anchor_audit_min_rate_bps. A larger bond buys a lower rate.
  uint32 audit_rate_bps = 26;
  // selected is the beacon coin at audit_rate_bps: only selected tasks open, prove, vote and
  // hold settlement; an unselected task settles on the round-1 verdict alone.
  bool selected = 27;
  // audit_basis spells out R, D and the coin for audit.
  string audit_basis = 28;
  // Height by which the Worker's opening must be recorded (ADR-0040 v6); later openings are refused.
  uint64 opening_deadline_height = 29;
  // Height by which the Worker's proof must be recorded (ADR-0040 v6); later proofs are refused.
  uint64 proof_deadline_height = 30;
  // Slashable base D fixed at sampling: the Worker's effective active bond then (ADR-0040 v6).
  // A REJECT or TIMEOUT slash is requested against D, so bond moved out after sampling
  // is reached through the unbonding queue.
  uint64 slashable_bond = 31;
  // anchor_commit_uri locates the Worker's anchor_commit artifact in DA; its digest is the
  // receipt's WORKER_ANCHOR_OPENING commitment.
  string anchor_commit_uri = 32;
  // epoch_manifest_hash is sha256 of the canonical epoch manifest the Worker's proof covers.
  bytes epoch_manifest_hash = 33;
  // epoch_manifest_uri locates the epoch manifest in DA.
  string epoch_manifest_uri = 34;
}

// AnchorVoteKeyState delegates anchor votes of one validator to a hot vote address,
// so the operator key can stay offline (ADR-0040 v6).
message AnchorVoteKeyState {
  // validator_operator_address is the delegating validator.
  string validator_operator_address = 1;
  // vote_address may sign MsgSubmitAnchorValidatorVote for the validator.
  string vote_address = 2;
  // height is when the delegation was recorded.
  uint64 height = 3;
}

// MsgSubmitAnchorOpening records the Worker's opening of the sampled
// positions: the material hash, its size and where it can be fetched. The
// outer Cosmos signer is the winner Worker's current service address.
// MsgSubmitAnchorOpening defines the MsgSubmitAnchorOpening wire type.
message MsgSubmitAnchorOpening {
  bytes task_id = 1;
  repeated uint64 positions = 2;
  bytes opening_hash = 3;
  uint64 opening_size_bytes = 4;
  string opening_uri = 5;
  string submitter_address = 6;
  // anchor_commit_uri locates the anchor_commit artifact in DA (ADR-0040 v6).
  string anchor_commit_uri = 7;
}

// MsgSubmitAnchorOpeningResponse defines the MsgSubmitAnchorOpeningResponse wire type.
message MsgSubmitAnchorOpeningResponse {
  shared.v1.MutationStatusV1 status = 1;
}

// MsgSubmitAnchorProof records the Worker's proof package over its recorded
// opening: the proof hash, its size and where it can be fetched. The outer
// Cosmos signer is the winner Worker's current service address.
// MsgSubmitAnchorProof defines the MsgSubmitAnchorProof wire type.
message MsgSubmitAnchorProof {
  bytes task_id = 1;
  bytes opening_hash = 2;
  bytes proof_hash = 3;
  uint64 proof_size_bytes = 4;
  string proof_uri = 5;
  string submitter_address = 6;
  // epoch_manifest_hash is sha256 of the canonical epoch manifest (ADR-0040 v6).
  bytes epoch_manifest_hash = 7;
  // epoch_manifest_uri locates the epoch manifest in DA.
  string epoch_manifest_uri = 8;
}

// MsgSubmitAnchorProofResponse defines the MsgSubmitAnchorProofResponse wire type.
message MsgSubmitAnchorProofResponse {
  shared.v1.MutationStatusV1 status = 1;
}

// MsgSubmitAnchorAuditResult records the auditor's per-position verdicts over
// the opening whose hash it names. The outer Cosmos signer is a selected
// Verifier's current service address.
// MsgSubmitAnchorAuditResult defines the MsgSubmitAnchorAuditResult wire type.
message MsgSubmitAnchorAuditResult {
  bytes task_id = 1;
  bytes opening_hash = 2;
  repeated AnchorPositionVerdictV1 verdicts = 3;
  bytes proof_hash = 4;
  string submitter_address = 5;
}

// MsgSubmitAnchorAuditResultResponse defines the MsgSubmitAnchorAuditResultResponse wire type.
message MsgSubmitAnchorAuditResultResponse {
  AnchorVerdictV1 task_verdict = 1;
  shared.v1.MutationStatusV1 status = 2;
}

// MsgSubmitAnchorValidatorVote is a bonded consensus validator's verdict on the Worker's
// recorded anchor proof (ADR-0040 v4). The signer must be the validator operator's account
// or the vote address it registered with MsgRegisterAnchorVoteKey (v6).
// The verdict is final once one side holds >= 2/3 of the last bonded voting power.
message MsgSubmitAnchorValidatorVote {
  bytes task_id = 1;
  bytes opening_hash = 2;
  bytes proof_hash = 3;
  AnchorVerdictV1 verdict = 4;
  repeated AnchorPositionVerdictV1 verdicts = 5;
  string validator_operator_address = 6;
  string submitter_address = 7;
}

// MsgSubmitAnchorValidatorVoteResponse reports the audit after the vote.
message MsgSubmitAnchorValidatorVoteResponse {
  // task_verdict is the audit verdict (UNSPECIFIED while open).
  AnchorVerdictV1 task_verdict = 1;
  // finalized is true once the verdict is final.
  bool finalized = 2;
  // tally is the running tally.
  AnchorVoteTallyV1 tally = 3;
  // status reports whether the vote changed state.
  shared.v1.MutationStatusV1 status = 4;
}

// MsgRegisterAnchorVoteKey lets a validator operator delegate its anchor votes to a hot
// vote address (ADR-0040 v6). The signer is the validator operator's account; an empty
// vote_address clears the delegation.
message MsgRegisterAnchorVoteKey {
  string validator_operator_address = 1;
  string vote_address = 2;
  string submitter_address = 3;
}

// MsgRegisterAnchorVoteKeyResponse defines the MsgRegisterAnchorVoteKeyResponse wire type.
message MsgRegisterAnchorVoteKeyResponse {
  shared.v1.MutationStatusV1 status = 1;
}

// QueryAnchorAuditsPendingRequest pages over audits awaiting a final verdict.
message QueryAnchorAuditsPendingRequest {
  // start_after resumes after this task id (exclusive); empty starts at the beginning.
  bytes start_after = 1;
  // limit caps the page (default 100, maximum 500).
  uint32 limit = 2;
}

// QueryAnchorAuditsPendingResponse lists sampled, selected, not yet final audits by task id.
message QueryAnchorAuditsPendingResponse {
  repeated AnchorAuditState audits = 1;
  // next is the start_after of the following page; empty at the end.
  bytes next = 2;
}

// QueryAnchorVoteKeyRequest names one validator.
message QueryAnchorVoteKeyRequest {
  string validator_operator_address = 1;
}

// QueryAnchorVoteKeyResponse returns the validator's vote delegation.
message QueryAnchorVoteKeyResponse {
  AnchorVoteKeyState vote_key = 1;
}

// QueryAnchorVotesRequest names one task.
message QueryAnchorVotesRequest {
  bytes task_id = 1;
}

// QueryAnchorVotesResponse lists the validator votes and the tally of one audit.
message QueryAnchorVotesResponse {
  repeated AnchorValidatorVoteState votes = 1;
  AnchorVoteTallyV1 tally = 2;
}

// QueryAnchorAuditRequest defines the QueryAnchorAuditRequest wire type.
message QueryAnchorAuditRequest {
  bytes task_id = 1;
}

// QueryAnchorAuditResponse defines the QueryAnchorAuditResponse wire type.
message QueryAnchorAuditResponse {
  AnchorAuditState audit = 1;
}
