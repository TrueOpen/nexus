syntax = "proto3";
package task.v1;

import "shared/v1/amount.proto";
import "shared/v1/common.proto";
import "task/v1/dispatch.proto";

option go_package = "github.com/TrueOpen/nexus/gen/trueopen/task/v1;taskv1";

// TaskParamsV1 is the single Task parameter root.
message TaskParamsV1 {
  uint32 schema_version = 1;
  SessionParamsV1 session = 2;
  TaskDeadlineParamsV1 deadlines = 3;
  TaskProposalParamsV1 proposals = 4;
  CandidateWeightParamsV1 weights = 5;
  VerificationParamsV1 verification = 6;
  EvidenceLimitParamsV1 evidence = 7;
  TaskCleanupParamsV1 cleanup = 8;
  BatchParamsV1 batch = 9;
  GenerationLimitParamsV1 generation = 10;
  TaskFeeParamsV1 fee = 11;
  ChallengeParamsV1 challenge = 12;

  DispatchParamsV1 dispatch = 13;
}

// TaskParamsMetaState is written atomically with TaskParamsV1.
message TaskParamsMetaState {
  uint64 params_version = 1;
  bytes params_hash = 2;
  uint64 updated_height = 3;
}

// SessionParamsV1 bounds session admission, lifecycle, and retention work.
message SessionParamsV1 {
  uint32 max_order_sequences_per_active_session = 1;
  uint64 session_idle_ttl_blocks = 2;
  uint64 session_close_ttl_blocks = 3;
  // At least record_deadline_blocks plus the larger of (claim + rebuttal) and
  // (dispatch challenge + response). Existing Sessions keep their version.
  uint64 session_order_retention_blocks = 4;
  uint32 max_session_history_prune_items_per_block = 5;
  uint64 session_terminal_summary_retention_blocks = 6;
  uint32 max_session_terminal_summary_prune_items_per_block = 7;
  uint32 max_session_sweep_per_block = 8;
  uint64 cancel_order_min_gas = 9;

  reserved 10;
  reserved "anchor_freshness_window_blocks";
  // Positive deployment-configured limit. Registration and renewal read the
  // current effective value, not ParamsForSession; later governance changes do
  // not rewrite an existing grant's expiry. Fresh genesis requires a positive value.
  uint64 max_session_key_blocks = 11;

  uint64 session_withdraw_delay_blocks = 12;
  uint64 session_change_delay_blocks = 13;
  shared.v1.Amount session_min_prefund = 14;
  uint32 max_active_sessions_per_account = 15;
}

// TaskDeadlineParamsV1 defines verification clocks and deadline sweep work.
message TaskDeadlineParamsV1 {
  uint64 verify_open_deadline_blocks = 1;
  uint64 commit_window_blocks = 2;
  uint64 reveal_window_blocks = 3;
  uint64 collection_window_blocks = 4;
  uint64 settle_margin_blocks = 5;
  uint64 self_rescue_margin_blocks = 6;
  uint32 max_deadline_sweep_per_block = 7;
}

// TaskProposalParamsV1 bounds candidate proposal and finalize work.
message TaskProposalParamsV1 {
  uint32 max_candidate_handraises_per_proposal = 1;
  uint64 max_candidate_proposal_bytes = 2;
  uint32 max_candidate_accepted_proposals_per_stage = 3;
  uint32 max_candidate_union_members_per_stage = 4;
  uint32 max_candidate_stage_finalize_tasks_per_block = 5;
  uint32 max_candidate_stage_finalize_members_per_block = 6;
}

// CandidateWeightParamsV1 defines deterministic worker and verifier selection.
message CandidateWeightParamsV1 {
  uint32 worker_stake_weight_ppm = 1;
  uint32 worker_performance_weight_ppm = 2;
  uint32 verifier_stake_weight_ppm = 3;
  uint32 verifier_performance_weight_ppm = 4;
  uint32 verifier_candidate_ratio_ppm = 5;
  uint32 verifier_candidate_window_min = 6;
  uint32 verifier_candidate_window_max = 7;
  uint32 selected_verifier_count = 8;
  uint32 k_stake = 9;
  uint32 candidate_weight_ppm_max = 10;
  uint32 max_weighted_draw_attempts_per_selection = 11;
}

// VerificationParamsV1 defines registered timeout and fault consequences.
message VerificationParamsV1 {
  reserved 2, 3, 6;
  reserved "verifier_miss_jail_blocks", "verifier_result_missing_jail_blocks", "verifier_miss_clear_success_count";

  uint32 worker_infer_timeout_slash_bps = 1;
  uint32 result_reveal_missing_slash_bps = 4;
  uint32 builder_fault_slash_bps = 5;
  // Basis points of the slashable bond D (fixed at sampling) taken when the
  // validators REJECT the Worker's anchor proof (ADR-0040 v6). Zero disables it.
  uint32 anchor_reject_slash_bps = 7;
  // Validator voting window after the proof deadline (ADR-0040 v6). Must be > 0.
  uint64 anchor_verdict_window_blocks = 8;
  // Floor of the per-task audit probability in basis points.
  uint32 anchor_audit_min_rate_bps = 9;
  // Risk margin k (basis points) in s = k*R / (D + k*R); 10000 = 1x.
  uint32 anchor_audit_risk_margin_bps = 10;
  // Blocks after sampling within which the Worker must record its opening. Must be > 0.
  uint64 anchor_open_window_blocks = 11;
  // Blocks after the opening deadline within which the Worker must record its proof. Must be > 0.
  uint64 anchor_proof_window_blocks = 12;
  // Basis points of D taken when the Worker never opened or never proved by the deadline.
  uint32 anchor_timeout_slash_bps = 13;
}

// EvidenceLimitParamsV1 bounds evidence payloads and supported version catalogs.
message EvidenceLimitParamsV1 {
  reserved 1;
  reserved "max_full_result_reveal_bytes";

  uint64 max_evidence_retention_blocks = 2;
  uint32 max_infer_evidence_commitments_per_receipt = 3;
  uint64 max_infer_receipt_commitment_bytes = 4;
  uint32 max_supported_evidence_schema_versions = 5;
  uint32 max_supported_leaf_ordering_versions = 6;
  repeated string evidence_schema_version_supported = 7;
  repeated string leaf_ordering_version_supported = 8;
  uint64 max_output_mmr_leaves = 9;
  uint32 min_output_stream_frame_bytes = 10;
  uint64 max_worker_evidence_bytes_v1 = 11;
  // Zero keeps encryption inactive in fresh Phase 0.
  uint64 encryption_activation_height = 12;
  // Active from fresh Phase 1 genesis; bounds contradiction-evidence admission.
  uint64 verifier_value_evidence_window_blocks = 13;
  uint32 max_verifier_value_evidence_positions = 14;
  uint64 max_verifier_value_evidence_bytes = 15;
}

// TaskCleanupParamsV1 bounds terminal Task cleanup and summary retention.
message TaskCleanupParamsV1 {
  uint32 max_task_cleanup_items_per_block = 1;
  uint64 task_terminal_summary_retention_blocks = 2;
  uint32 max_task_terminal_summary_prune_items_per_block = 3;
  uint32 max_epoch_task_summary_items_per_block = 4;
  uint32 max_epoch_task_summary_support_candidates = 5;
  uint64 max_epoch_task_summary_bytes = 6;
  uint32 max_task_failure_class_prune_items_per_block = 7;
}

// BatchParamsV1 bounds verification batch item counts and canonical bytes.
message BatchParamsV1 {
  uint32 max_batch_commit_items = 1;
  uint32 max_batch_result_items = 2;
  uint64 max_batch_commit_bytes = 3;
  uint64 max_batch_result_bytes = 4;
}

// GenerationLimitParamsV1 bounds GenerationParamsV1 wire collections.
message GenerationLimitParamsV1 {
  uint32 stop_sequence_max_items = 1;
  uint32 stop_sequence_max_bytes_each = 2;
  uint32 stop_sequence_max_total_bytes = 3;
  uint32 stop_token_max_items = 4;
  uint32 top_k_max = 5;
  // Independent product limit; the canonical token-id raw field permits at
  // most 8,388,607 IDs.
  uint64 max_output_tokens = 6;
}

// TaskFeeParamsV1 freezes the only Phase 0 billing and reimbursement rule.
message TaskFeeParamsV1 {
  uint64 fee_rule_version = 1;
  uint32 maintenance_rate_bps = 2;
  uint64 fee_policy_version = 3;
  uint64 max_reimbursable_fee_per_gas_numerator = 4;
  uint64 max_reimbursable_fee_per_gas_denominator = 5;
  shared.v1.Amount max_reimbursement_per_tx = 6;
  shared.v1.Amount max_reimbursement_per_task = 7;
}

// ChallengeParamsV1 bounds the single optional funded verification round.
message ChallengeParamsV1 {
  uint32 max_verify_round = 1;
  uint32 max_open_round_per_task = 2;
  uint32 challenge_verifier_count = 3;
  shared.v1.Amount challenge_open_bond = 4;
  uint32 challenge_inconclusive_bond_slash_bps = 5;
  uint32 challenge_fault_slash_bps = 6;
  uint64 candidate_window_delay_blocks = 7;
  uint64 handraise_window_blocks = 8;
  uint64 assignment_delay_blocks = 9;
  uint64 commit_window_blocks = 10;
  uint64 reveal_window_blocks = 11;
  uint32 max_round_effect_items_per_block = 12;
}

// DispatchParamsV1 defines the canonical DispatchParamsV1 fields.
message DispatchParamsV1 {
  uint64 record_deadline_blocks = 1;
  uint32 max_dispatch_entries_per_record = 2;
  uint64 max_dispatch_record_bytes = 3;
  uint32 max_skips = 4;
  uint64 sticky_window_blocks = 5;
  uint32 sticky_max_orders = 6;
  uint64 dispatch_compensation_claim_window_blocks = 7;
  uint64 dispatch_compensation_rebuttal_blocks = 8;
  uint64 dispatch_challenge_window_blocks = 9;
  uint64 dispatch_challenge_response_blocks = 10;
  // Exceeds the sum of the protocol hard claim, rebuttal, challenge and response
  // windows, preserving all consumers through terminal resolution.
  uint64 dispatch_record_retention_blocks = 11;
  uint64 max_dispatch_roster_bytes = 12;
  uint32 max_pending_per_session = 13;
  uint32 builder_max_inflight_per_session = 14;
  uint64 order_freshness_margin_blocks = 15;
  uint64 max_prerecord_output_tokens = 16;

  repeated PrefillCompensationV1 prefill_compensation_by_model_tier = 17;
  repeated DispatchFaultPenaltyV1 dispatch_fault_penalty_by_kind = 18;
  // Exactly one positive cap per challenge kind, including DOUBLE_DISPATCH.
  repeated DispatchChallengeGasCapV1 dispatch_challenge_gas_cap_by_kind = 19;
  shared.v1.Amount builder_compensation_account_min_balance = 20;
  uint64 dispatch_evidence_retention_blocks = 21;
  // ServiceBond slash for a Worker signing both rejection and acceptance; 0..10000.
  uint32 worker_dispatch_contradiction_slash_bps = 22;
  // Maximum order_expire_height - earliest_submit_height at order admission,
  // including takeover registration. Positive and at most 7200 blocks in V1;
  // the Session freezes this policy. Compensation does not reauthorize orders.
  uint64 max_order_lifetime_blocks = 23;
}

// PrefillCompensationV1 defines the canonical PrefillCompensationV1 fields.
message PrefillCompensationV1 {
  uint32 resource_tier = 1;
  shared.v1.Amount amount = 2;
}
// DispatchFaultPenaltyV1 defines the canonical DispatchFaultPenaltyV1 fields.
message DispatchFaultPenaltyV1 {
  shared.v1.DispatchChallengeKindV1 kind = 1;
  shared.v1.Amount amount = 2;
}
// DispatchChallengeGasCapV1 defines the canonical DispatchChallengeGasCapV1 fields.
message DispatchChallengeGasCapV1 {
  shared.v1.DispatchChallengeKindV1 kind = 1;
  uint64 gas_cap = 2;
}
