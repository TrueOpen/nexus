syntax = "proto3";
package hub.v1;

import "shared/v1/common.proto";

option go_package = "github.com/TrueOpen/nexus/gen/trueopen/hub/v1;hubv1";

// MsgRegisterVrfKey registers or rotates a validator's independent ECVRF key.
// The Keeper derives pending_from_epoch as current_epoch + 1.
// MsgRegisterVrfKey defines the MsgRegisterVrfKey wire type.
message MsgRegisterVrfKey {
  bytes vrf_pubkey = 1;
  bytes vrf_key_pop = 2;
  uint64 vrf_authorization_nonce = 3;
  string operator_address = 4;
}

// MsgRegisterVrfKeyResponse reports the pending activation and accepted nonce.
message MsgRegisterVrfKeyResponse {
  string operator_address = 1;
  uint64 pending_from_epoch = 2;
  uint64 vrf_authorization_nonce = 3;
  shared.v1.MutationStatusV1 status = 4;
}
