syntax = "proto3";
package shared.v1;


option go_package = "github.com/TrueOpen/nexus/gen/trueopen/shared/v1;sharedv1";

// This file is the single home of the public event-stream common wire:
// the one protocol event code registry plus the stream metadata shared
// by every public event service. task.v1.TaskEventService and
// hub.v1.HubEventService both reference these declarations, so the
// module-split closure rule (§5.3 shared symbol manifest) makes them shared.
// Owner packages keep their own typed payload oneofs: Hub-owned payloads,
// locators and the chain event envelope stay in hub.v1 and Task-owned
// payload/event messages stay in task.v1.
//
// Every stream envelope orders events by the total position
// (chain_height, source_order, tx_index, event_index). source_order is derived
// from the TaskEventSource enum number, TX(1) < FINALIZE_BLOCK(2); it is a
// derived quantity and never a wire field, which is why a FinalizeBlock event
// with tx_index = 0 can never collide with a Tx position. If an event at a
// position matches a subscriber's filter it is sent before the checkpoint for
// that position, and every service emits byte-identical cursor checkpoints for
// the same position even when one side had no matching event.

// ProtocolEventCodeV1 is the single stable public event code registry of
// the API contract for the whole protocol; §17 forbids any second event
// code authority. Codes are sparse on purpose and are never renumbered.
//
// Hub-domain and Task-domain codes are both registered here, while their typed
// payload messages stay with their owning module: Hub payloads in
// hub/v1/event.proto and Task payloads in task/v1/event.proto.
// The API contract requires one numeric definition per closed enum, and
// the module split forbids x/hub from importing x/task, so the shared
// code enum lives in shared.v1 and the payload oneof is split by owner.
// ProtocolEventCodeV1 defines the ProtocolEventCodeV1 wire type.
enum ProtocolEventCodeV1 {
  // Never emitted; rejects zero-value envelopes and filters.
  // PROTOCOL_EVENT_CODE_V1_UNSPECIFIED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_UNSPECIFIED = 0;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_SESSION_CREATED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_SESSION_CREATED = 1;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_ORDER_CANCELLED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_ORDER_CANCELLED = 2;
  // Hub-domain payload: a new profile and its registration fee committed.
  // PROTOCOL_EVENT_CODE_V1_MODEL_PROFILE_REGISTERED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_MODEL_PROFILE_REGISTERED = 3;
  // Hub-domain payload: a profile status actually changed.
  // PROTOCOL_EVENT_CODE_V1_MODEL_PROFILE_STATE_CHANGED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_MODEL_PROFILE_STATE_CHANGED = 4;
