  PROTOCOL_EVENT_CODE_V1_SERVICE_UNBONDING_STARTED = 7;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_REVEAL_PHASE_STARTED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_REVEAL_PHASE_STARTED = 8;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_TASK_FAILURE_CLASS_UPDATED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_TASK_FAILURE_CLASS_UPDATED = 9;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_WORKER_HANDRAISES_ACCEPTED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_WORKER_HANDRAISES_ACCEPTED = 10;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_WORKER_ASSIGNMENT_FINALIZED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_WORKER_ASSIGNMENT_FINALIZED = 11;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_INFER_RECEIPT_ACCEPTED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_INFER_RECEIPT_ACCEPTED = 12;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_VERIFIER_ASSIGNMENT_FINALIZED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_VERIFIER_ASSIGNMENT_FINALIZED = 13;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_DATA_UNAVAILABLE_REPORTED identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_DATA_UNAVAILABLE_REPORTED = 14;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_BUILDER_DATA_UNAVAILABLE identifies the corresponding protocol value.
  PROTOCOL_EVENT_CODE_V1_BUILDER_DATA_UNAVAILABLE = 15;
  // Task-domain payload; declared in task/v1/event.proto.
  // PROTOCOL_EVENT_CODE_V1_COMMIT_ACCEPTED identifies the corresponding protocol value.
