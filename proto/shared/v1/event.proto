// StreamCheckpoint advances a subscriber cursor even when no event matches its
// filters. It identifies the boundary after the committed global event position
// it reports, so a subscriber can cross a range with no matching event.
//
// cursor is an opaque global chain-position token produced by one Node. A
// consumer may only use it as an equality barrier and as a resume token; it must
// never be compared lexicographically. Cross-stream ordering uses the explicit
// (chain_height, source_order, tx_index, event_index) position instead.
// StreamCheckpoint defines the StreamCheckpoint wire type.
message StreamCheckpoint {
  string cursor = 1;
  uint64 chain_height = 2;
}

// TaskEventSource identifies the BlockResults section that emitted an event. Its
// enum number is also the source_order component of the total event position:
// TX(1) sorts before FINALIZE_BLOCK(2) at the same chain_height. source_order is
// derived from this number and is never carried as a separate wire field.
// TaskEventSource defines the TaskEventSource wire type.
enum TaskEventSource {
  // TASK_EVENT_SOURCE_UNSPECIFIED is never emitted.
  TASK_EVENT_SOURCE_UNSPECIFIED = 0;
  // TASK_EVENT_SOURCE_TX identifies an event in a successful transaction.
  TASK_EVENT_SOURCE_TX = 1;
  // TASK_EVENT_SOURCE_FINALIZE_BLOCK identifies a finalization event.
  TASK_EVENT_SOURCE_FINALIZE_BLOCK = 2;
}

// EventRole identifies why an operator is a target of an event.
enum EventRole {
  // EVENT_ROLE_UNSPECIFIED is never accepted as a filter or emitted as a target.
  EVENT_ROLE_UNSPECIFIED = 0;
  // EVENT_ROLE_WORKER identifies an inference worker.
  EVENT_ROLE_WORKER = 1;
  // EVENT_ROLE_VERIFIER identifies a verification worker.
  EVENT_ROLE_VERIFIER = 2;
  // EVENT_ROLE_BUILDER identifies a task builder.
  EVENT_ROLE_BUILDER = 3;
  // EVENT_ROLE_USER identifies a task owner.
  EVENT_ROLE_USER = 4;
  // EVENT_ROLE_OPERATOR identifies a service operator without a narrower role.
  EVENT_ROLE_OPERATOR = 5;
  // EVENT_ROLE_VALIDATOR identifies a consensus validator.
  EVENT_ROLE_VALIDATOR = 6;
  // EVENT_ROLE_ACCOUNT identifies an account without a narrower known role.
  EVENT_ROLE_ACCOUNT = 7;
}

// EventTarget identifies one intended event recipient. Targets are routing
// metadata only and do not grant authority.
// EventTarget defines the EventTarget wire type.
message EventTarget {
  EventRole role = 1;
  string address = 2;
}
